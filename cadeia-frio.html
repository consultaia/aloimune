<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ===========================================================================
   AVALIAÇÃO DO PONTO — combina duas checagens:
     EXCURSÃO   : temperatura (atual, mínima ou máxima do período) fora da faixa
     ATRASADA   : horas desde a última leitura > intervalo permitido
   Prioridade: excursão > atrasada > ok. Sem leitura -> 'sem_leitura'.
   (A checagem de "atrasada" é a mesma lógica de prazo do cofre, em horas.)
   =========================================================================== */
function avaliarPonto(ponto, leituras) {
  const ordenadas = [...leituras].sort((a,b) => new Date(b.medido_em) - new Date(a.medido_em));
  const ultima = ordenadas[0];
  if (!ultima) return { status: "sem_leitura", ultima: null, horas: null, ordenadas };
  const horas = (Date.now() - new Date(ultima.medido_em)) / 3600000;
  const atrasada = horas > (ponto.intervalo_horas ?? 12);
  const acima = Math.max(ultima.temp_atual, ultima.temp_max ?? -Infinity) > ponto.temp_max;
  const abaixo = Math.min(ultima.temp_atual, ultima.temp_min ?? Infinity) < ponto.temp_min;
  const status = (acima || abaixo) ? "excursao" : atrasada ? "atrasada" : "ok";
  return { status, ultima, horas, ordenadas };
}
window.avaliarPonto = avaliarPonto;

const STATUS = {
  excursao:    { label: "Excursão",    rank: 0 },
  atrasada:    { label: "Leitura atrasada", rank: 1 },
  sem_leitura: { label: "Sem leitura", rank: 2 },
  ok:          { label: "Na faixa",    rank: 3 },
};

const sb = (SUPABASE_URL && SUPABASE_ANON_KEY)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function demoData() {
  const h = (n) => new Date(Date.now() - n*3600000).toISOString();
  const pontos = [
    { id:"p1", nome:"Geladeira de imunobiológicos", tipo:"Imunobiológicos", local:"Sala de imunização", temp_min:2, temp_max:8, intervalo_horas:12 },
    { id:"p2", nome:"Geladeira de amostras", tipo:"Amostras", local:"Posto de coleta", temp_min:2, temp_max:8, intervalo_horas:12 },
    { id:"p3", nome:"Freezer de amostras", tipo:"Amostras", local:"Posto de coleta", temp_min:-25, temp_max:-15, intervalo_horas:24 },
  ];
  const leituras = [
    { id:"l1", ponto_id:"p1", medido_em:h(2),  temp_atual:5.1, temp_min:4.6, temp_max:5.8, responsavel:"Recepção" },
    { id:"l2", ponto_id:"p1", medido_em:h(10), temp_atual:4.8, temp_min:4.2, temp_max:6.0, responsavel:"Recepção" },
    { id:"l3", ponto_id:"p1", medido_em:h(22), temp_atual:5.4, temp_min:4.9, temp_max:6.2, responsavel:"Recepção" },
    { id:"l4", ponto_id:"p2", medido_em:h(1),  temp_atual:9.3, temp_min:5.1, temp_max:9.3, responsavel:"Coleta" },
    { id:"l5", ponto_id:"p2", medido_em:h(9),  temp_atual:6.0, temp_min:4.8, temp_max:6.4, responsavel:"Coleta" },
    { id:"l6", ponto_id:"p3", medido_em:h(30), temp_atual:-19.0, temp_min:-21.0, temp_max:-17.5, responsavel:"Coleta" },
  ];
  return { pontos, leituras };
}

function Sparkline({ leituras, min, max }) {
  const pts = [...leituras].sort((a,b)=> new Date(a.medido_em)-new Date(b.medido_em)).slice(-14);
  if (pts.length < 2) return <div className="band">Sem histórico suficiente para o gráfico.</div>;
  const W=280, H=64, pad=6;
  const temps = pts.map(p=>p.temp_atual);
  const lo = Math.min(min, ...temps), hi = Math.max(max, ...temps);
  const rng = (hi-lo)||1;
  const x = (i)=> pad + (i*(W-2*pad))/(pts.length-1);
  const y = (t)=> pad + (H-2*pad)*(1-(t-lo)/rng);
  const line = pts.map((p,i)=> `${i===0?"M":"L"}${x(i).toFixed(1)},${y(p.temp_atual).toFixed(1)}`).join(" ");
  return (
    <svg className="spark" width="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <rect x="0" y={y(max)} width={W} height={Math.max(0,y(min)-y(max))} fill="#E7F4EE" />
      <line x1="0" y1={y(max)} x2={W} y2={y(max)} stroke="#B9D9C7" strokeDasharray="3 3" />
      <line x1="0" y1={y(min)} x2={W} y2={y(min)} stroke="#B9D9C7" strokeDasharray="3 3" />
      <path d={line} fill="none" stroke="#0E7C7B" strokeWidth="2" />
      {pts.map((p,i)=>{
        const fora = p.temp_atual>max || p.temp_atual<min;
        return <circle key={i} cx={x(i)} cy={y(p.temp_atual)} r={fora?3.5:2.5} fill={fora?"#C0392B":"#0E7C7B"} />;
      })}
    </svg>
  );
}

function fmtWhen(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,"0"), mm = String(d.getMonth()+1).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0"), mi = String(d.getMinutes()).padStart(2,"0");
  return `${dd}/${mm} ${hh}:${mi}`;
}
function horasTxt(h) {
  if (h == null) return "";
  if (h < 1) return "há poucos minutos";
  if (h < 24) return `há ${Math.floor(h)} h`;
  return `há ${Math.floor(h/24)} d`;
}

function PontoCard({ ponto, leituras, onRegistrar, onReload }) {
  const [open, setOpen] = useState(false);
  const { status, ultima, horas, ordenadas } = avaliarPonto(ponto, leituras);
  return (
    <div className={"cardp s-" + status}>
      <div className="head">
        <div>
          <div className="nome">{ponto.nome}</div>
          <div className="sub">{ponto.local || ponto.tipo || ""}</div>
          <div className="band">Faixa: {ponto.temp_min} a {ponto.temp_max} °C · leitura a cada {ponto.intervalo_horas} h</div>
        </div>
        <span className={"pill p-" + status}>{STATUS[status].label}</span>
      </div>

      {ultima ? (
        <>
          <div className="reading">
            <span className="big">{Number(ultima.temp_atual).toFixed(1)}</span>
            <span className="unit">°C</span>
            {(ultima.temp_min != null && ultima.temp_max != null) &&
              <span className="minmax">mín {Number(ultima.temp_min).toFixed(1)} · máx {Number(ultima.temp_max).toFixed(1)}</span>}
          </div>
          <div className="when">Última leitura {fmtWhen(ultima.medido_em)} · {horasTxt(horas)}{ultima.responsavel ? ` · ${ultima.responsavel}` : ""}</div>
          <Sparkline leituras={ordenadas} min={ponto.temp_min} max={ponto.temp_max} />
        </>
      ) : (
        <div className="when" style={{marginTop:14}}>Nenhuma leitura registrada ainda.</div>
      )}

      <div className="card-actions">
        <button className="btn btn-primary btn-sm" onClick={() => onRegistrar(ponto)}>Registrar leitura</button>
      </div>

      {ordenadas.length > 0 &&
        <button className="linkbtn" onClick={() => setOpen(o=>!o)}>
          {open ? "Ocultar histórico" : `Ver histórico (${ordenadas.length})`}
        </button>}
      {open &&
        <div className="hist">
          <table><tbody>
            {ordenadas.slice(0,20).map(l => {
              const fora = l.temp_atual>ponto.temp_max || l.temp_atual<ponto.temp_min;
              return (
                <tr key={l.id}>
                  <td className={fora ? "out" : ""}>{Number(l.temp_atual).toFixed(1)} °C</td>
                  <td>{fmtWhen(l.medido_em)}</td>
                </tr>
              );
            })}
          </tbody></table>
        </div>}
    </div>
  );
}

function AppTemperatura() {
  const [pontos, setPontos] = useState([]);
  const [leituras, setLeituras] = useState([]);
  const [loading, setLoading] = useState(true);
  const [registrando, setRegistrando] = useState(null);

  async function load() {
    setLoading(true);
    if (sb) {
      const [p, l] = await Promise.all([
        sb.from("pontos_frio").select("*").eq("ativo", true),
        sb.from("leituras").select("*").order("medido_em", { ascending:false }).limit(500),
      ]);
      if (p.error || l.error) alert("Erro Supabase: " + (p.error?.message || l.error?.message));
      setPontos(p.data || []); setLeituras(l.data || []);
    } else {
      const d = demoData(); setPontos(d.pontos); setLeituras(d.leituras);
    }
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const porPonto = useMemo(() => {
    const m = {}; pontos.forEach(p => m[p.id] = []);
    leituras.forEach(l => { (m[l.ponto_id] = m[l.ponto_id] || []).push(l); });
    return m;
  }, [pontos, leituras]);

  const counts = useMemo(() => {
    const c = { excursao:0, atrasada:0, sem_leitura:0, ok:0 };
    pontos.forEach(p => c[avaliarPonto(p, porPonto[p.id] || []).status]++);
    return c;
  }, [pontos, porPonto]);

  async function salvarLeitura(form) {
    const payload = {
      ponto_id: form.ponto_id,
      temp_atual: Number(form.temp_atual),
      temp_min: form.temp_min === "" ? null : Number(form.temp_min),
      temp_max: form.temp_max === "" ? null : Number(form.temp_max),
      responsavel: form.responsavel || null,
    };
    if (Number.isNaN(payload.temp_atual)) return "Informe a temperatura atual.";
    if (sb) {
      const { error } = await sb.from("leituras").insert(payload);
      if (error) return error.message;
      await load();
    } else {
      setLeituras(prev => [{ ...payload, id:"n"+Date.now(), medido_em:new Date().toISOString() }, ...prev]);
    }
    setRegistrando(null);
    return null;
  }

  const tiles = [
    ["excursao","Em excursão","t-bad"],
    ["atrasada","Leitura atrasada","t-warn"],
    ["sem_leitura","Sem leitura","t-pend"],
    ["ok","Na faixa","t-ok"],
  ];

  return (
    <div>
      <div className="tiles">
        {tiles.map(([k,l,cls]) => (
          <div key={k} className={"tile " + cls}>
            <div className="n">{counts[k]}</div>
            <div className="l">{l}</div>
          </div>
        ))}
      </div>

      {loading ? (
        <div className="empty">Carregando…</div>
      ) : pontos.length === 0 ? (
        <div className="empty">Nenhum equipamento cadastrado. Rode o schema ou adicione um ponto no Supabase.</div>
      ) : (
        <div className="grid-cards">
          {pontos.map(p => (
            <PontoCard key={p.id} ponto={p} leituras={porPonto[p.id] || []}
                       onRegistrar={setRegistrando} onReload={load} />
          ))}
        </div>
      )}

      {registrando &&
        <RegistroModal ponto={registrando} onClose={() => setRegistrando(null)} onSave={salvarLeitura} />}
    </div>
  );
}

function RegistroModal({ ponto, onClose, onSave }) {
  const [form, setForm] = useState({ ponto_id: ponto.id, temp_atual:"", temp_min:"", temp_max:"", responsavel:"" });
  const [err, setErr] = useState(""); const [saving, setSaving] = useState(false);
  const set = (k,v) => setForm(f => ({ ...f, [k]: v }));
  async function submit() {
    setSaving(true); const e = await onSave(form); setSaving(false);
    if (e) setErr(e);
  }
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h2>Registrar leitura</h2>
        <p className="mt">{ponto.nome} · faixa {ponto.temp_min} a {ponto.temp_max} °C</p>
        {err && <div className="err">{err}</div>}
        <div className="frow">
          <div className="field">
            <label>Atual (°C)</label>
            <input type="number" step="0.1" value={form.temp_atual} onChange={e=>set("temp_atual",e.target.value)} autoFocus />
          </div>
          <div className="field">
            <label>Mínima (°C)</label>
            <input type="number" step="0.1" value={form.temp_min} onChange={e=>set("temp_min",e.target.value)} />
          </div>
          <div className="field">
            <label>Máxima (°C)</label>
            <input type="number" step="0.1" value={form.temp_max} onChange={e=>set("temp_max",e.target.value)} />
          </div>
          <div className="field full">
            <label>Responsável</label>
            <input value={form.responsavel} onChange={e=>set("responsavel",e.target.value)} />
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={submit} disabled={saving}>
            {saving ? "Salvando…" : "Salvar leitura"}
          </button>
        </div>
      </div>
    </div>
  );
}


/* ===================== MANUTENÇÃO DE EQUIPAMENTOS ===================== */
const TIPOS_EQ=["Ultrassom","Autoclave","Centrífuga","Microscópio","Incubadora","Aparelho de anestesia","Monitor","Balança","Ar-condicionado","Computador/TI","Outro"];
const addMeses=(iso,n)=>{ if(!iso) return null; const [y,m,d]=iso.split("-").map(Number); const dt=new Date(y,m-1+n,d); return dt.toISOString().slice(0,10); };
const diasAte=(iso)=> iso ? Math.round((new Date(iso)-new Date(new Date().toISOString().slice(0,10)))/864e5) : null;
function statusEq(e){
  const d=diasAte(e.proxima_manutencao), c=diasAte(e.calibracao_validade);
  if((d!==null && d<0) || (c!==null && c<0)) return {cls:"bad", t: d!==null&&d<0 ? `manutenção vencida há ${-d}d` : `calibração vencida há ${-c}d`};
  if((d!==null && d<=30) || (c!==null && c<=30)) return {cls:"warn", t: d!==null&&d<=30 ? `manutenção em ${d}d` : `calibração em ${c}d`};
  if(d===null && c===null) return {cls:"muted", t:"sem data programada"};
  return {cls:"ok", t: d!==null ? `em dia · próxima em ${d}d` : `em dia`};
}
function AppManutencao(){
  const [eqs,setEqs]=useState([]); const [hist,setHist]=useState([]); const [loading,setLoading]=useState(true);
  const [edit,setEdit]=useState(null); const [manut,setManut]=useState(null); const [verHist,setVerHist]=useState(null);
  async function load(){
    setLoading(true);
    if(sb){ const [e,h]=await Promise.all([ sb.from("clinica_equipamentos").select("*").order("nome"), sb.from("clinica_manutencoes").select("*").order("data",{ascending:false}) ]);
      if(e.error) alert(e.error.message); setEqs(e.data||[]); setHist(h.data||[]); }
    else { setEqs([{id:"1",nome:"Ultrassom GE Voluson",tipo:"Ultrassom",local:"Consultório 1",ultima_manutencao:"2026-03-10",periodicidade_meses:12,proxima_manutencao:"2027-03-10",calibracao_validade:"2026-10-01",ativo:true}]); setHist([]); }
    setLoading(false);
  }
  useEffect(()=>{ load(); },[]);
  async function salvar(f){
    const payload={ nome:f.nome, tipo:f.tipo||null, local:f.local||null, serie:f.serie||null, fabricante:f.fabricante||null,
      ultima_manutencao:f.ultima_manutencao||null, periodicidade_meses:Number(f.periodicidade_meses)||12,
      proxima_manutencao: f.proxima_manutencao || (f.ultima_manutencao ? addMeses(f.ultima_manutencao, Number(f.periodicidade_meses)||12) : null),
      calibracao_validade:f.calibracao_validade||null, responsavel:f.responsavel||null, obs:f.obs||null, ativo:true };
    if(!payload.nome) return "Informe o nome do equipamento.";
    if(sb){ const r= f.id ? await sb.from("clinica_equipamentos").update(payload).eq("id",f.id) : await sb.from("clinica_equipamentos").insert(payload); if(r.error) return r.error.message; await load(); }
    else setEqs(p=> f.id ? p.map(x=>x.id===f.id?{...x,...payload}:x) : [...p,{...payload,id:"n"+Date.now()}]);
    setEdit(null); return null;
  }
  async function registrar(f){
    const e=manut; const data=f.data||new Date().toISOString().slice(0,10);
    const upd={ ultima_manutencao:data, proxima_manutencao:addMeses(data, e.periodicidade_meses||12) };
    if(f.tipo==="calibracao" && f.calibracao_validade) upd.calibracao_validade=f.calibracao_validade;
    if(sb){ const r1=await sb.from("clinica_manutencoes").insert({ equipamento_id:e.id, data, tipo:f.tipo, empresa:f.empresa||null, custo:f.custo?Number(f.custo):null, obs:f.obs||null }); if(r1.error) return r1.error.message;
      const r2=await sb.from("clinica_equipamentos").update(upd).eq("id",e.id); if(r2.error) return r2.error.message; await load(); }
    else setEqs(p=>p.map(x=>x.id===e.id?{...x,...upd}:x));
    setManut(null); return null;
  }
  async function excluir(e){ if(!confirm("Excluir "+e.nome+"?")) return; if(sb){ const r=await sb.from("clinica_equipamentos").delete().eq("id",e.id); if(r.error) return alert(r.error.message); await load(); } else setEqs(p=>p.filter(x=>x.id!==e.id)); }
  const fmt=(iso)=> iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "—";
  const c={ bad:eqs.filter(e=>statusEq(e).cls==="bad").length, warn:eqs.filter(e=>statusEq(e).cls==="warn").length, ok:eqs.filter(e=>statusEq(e).cls==="ok").length };
  return (
    <>
      <div className="tiles">
        <div className="tile t-bad"><div className="n">{c.bad}</div><div className="l">Vencidos</div></div>
        <div className="tile t-warn"><div className="n">{c.warn}</div><div className="l">Vencem em 30 dias</div></div>
        <div className="tile t-ok"><div className="n">{c.ok}</div><div className="l">Em dia</div></div>
        <div className="tile t-ink"><div className="n">{eqs.length}</div><div className="l">Equipamentos</div></div>
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}><button className="btn btn-primary" onClick={()=>setEdit({ periodicidade_meses:12 })}>+ Equipamento</button></div>
      <div className="grid">
        {loading ? <div className="empty">Carregando…</div> : eqs.length===0 ? <div className="empty">Nenhum equipamento cadastrado. Comece pelo ultrassom, autoclave, centrífuga…</div> :
         eqs.map(e=>{ const st=statusEq(e); return (
          <div key={e.id} className={"pcard "+st.cls}>
            <div className="ph"><div><div className="pn">{e.nome}</div><div className="pl">{[e.tipo,e.local].filter(Boolean).join(" · ")}{e.serie?` · nº ${e.serie}`:""}</div></div><span className={"badge "+st.cls}>{st.t}</span></div>
            <div className="meta" style={{marginTop:8}}>Última manutenção: <b>{fmt(e.ultima_manutencao)}</b> · a cada {e.periodicidade_meses} meses · próxima: <b>{fmt(e.proxima_manutencao)}</b>{e.calibracao_validade?<> · calibração até <b>{fmt(e.calibracao_validade)}</b></>:null}</div>
            <div className="acts" style={{marginTop:12,display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="btn btn-primary btn-sm" onClick={()=>setManut(e)}>Registrar manutenção</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setEdit(e)}>Editar</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setVerHist(e)}>Histórico ({hist.filter(h=>h.equipamento_id===e.id).length})</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>excluir(e)}>Excluir</button>
            </div>
            {verHist && verHist.id===e.id && <div style={{marginTop:10,borderTop:"1px solid var(--line)",paddingTop:8,fontSize:13}}>
              {hist.filter(h=>h.equipamento_id===e.id).length===0 ? <span style={{color:"var(--muted)"}}>Sem manutenções registradas.</span> :
               hist.filter(h=>h.equipamento_id===e.id).map(h=><div key={h.id} style={{padding:"4px 0"}}><b>{fmt(h.data)}</b> · {h.tipo}{h.empresa?` · ${h.empresa}`:""}{h.custo?` · R$ ${Number(h.custo).toFixed(2)}`:""}{h.obs?` — ${h.obs}`:""}</div>)}
            </div>}
          </div> ); })}
      </div>
      {edit && <EqModal e={edit} onClose={()=>setEdit(null)} onSave={salvar} />}
      {manut && <ManutModal e={manut} onClose={()=>setManut(null)} onSave={registrar} />}
    </>
  );
}
function EqModal({ e, onClose, onSave }){
  const [f,setF]=useState({ id:e.id, nome:e.nome||"", tipo:e.tipo||"Ultrassom", local:e.local||"", serie:e.serie||"", fabricante:e.fabricante||"", ultima_manutencao:e.ultima_manutencao||"", periodicidade_meses:e.periodicidade_meses||12, proxima_manutencao:e.proxima_manutencao||"", calibracao_validade:e.calibracao_validade||"", responsavel:e.responsavel||"", obs:e.obs||"" });
  const [err,setErr]=useState(""); const set=(k,v)=>setF(x=>({...x,[k]:v}));
  async function submit(){ const er=await onSave(f); if(er) setErr(er); }
  return (<div className="overlay" onClick={onClose}><div className="modal" onClick={ev=>ev.stopPropagation()} style={{maxWidth:560}}>
    <h2>{f.id?"Editar equipamento":"Novo equipamento"}</h2>{err && <div className="err">{err}</div>}
    <div className="form2">
      <div className="field full"><label>Nome</label><input value={f.nome} onChange={ev=>set("nome",ev.target.value)} placeholder="Ex.: Ultrassom GE Voluson" /></div>
      <div className="field"><label>Tipo</label><select value={f.tipo} onChange={ev=>set("tipo",ev.target.value)}>{TIPOS_EQ.map(t=><option key={t}>{t}</option>)}</select></div>
      <div className="field"><label>Local</label><input value={f.local} onChange={ev=>set("local",ev.target.value)} /></div>
      <div className="field"><label>Nº de série</label><input value={f.serie} onChange={ev=>set("serie",ev.target.value)} /></div>
      <div className="field"><label>Fabricante</label><input value={f.fabricante} onChange={ev=>set("fabricante",ev.target.value)} /></div>
      <div className="field"><label>Última manutenção</label><input type="date" value={f.ultima_manutencao} onChange={ev=>set("ultima_manutencao",ev.target.value)} /></div>
      <div className="field"><label>Periodicidade (meses)</label><input type="number" min="1" value={f.periodicidade_meses} onChange={ev=>set("periodicidade_meses",ev.target.value)} /></div>
      <div className="field"><label>Próxima (vazio = calcula)</label><input type="date" value={f.proxima_manutencao} onChange={ev=>set("proxima_manutencao",ev.target.value)} /></div>
      <div className="field"><label>Calibração válida até</label><input type="date" value={f.calibracao_validade} onChange={ev=>set("calibracao_validade",ev.target.value)} /></div>
      <div className="field"><label>Responsável</label><input value={f.responsavel} onChange={ev=>set("responsavel",ev.target.value)} /></div>
      <div className="field full"><label>Observações</label><input value={f.obs} onChange={ev=>set("obs",ev.target.value)} /></div>
    </div>
    <div className="modal-actions"><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={submit}>Salvar</button></div>
  </div></div>);
}
function ManutModal({ e, onClose, onSave }){
  const [f,setF]=useState({ data:new Date().toISOString().slice(0,10), tipo:"preventiva", empresa:"", custo:"", calibracao_validade:"", obs:"" });
  const [err,setErr]=useState(""); const set=(k,v)=>setF(x=>({...x,[k]:v}));
  async function submit(){ const er=await onSave(f); if(er) setErr(er); }
  return (<div className="overlay" onClick={onClose}><div className="modal" onClick={ev=>ev.stopPropagation()}>
    <h2>Registrar manutenção · {e.nome}</h2>{err && <div className="err">{err}</div>}
    <div className="form2">
      <div className="field"><label>Data</label><input type="date" value={f.data} onChange={ev=>set("data",ev.target.value)} /></div>
      <div className="field"><label>Tipo</label><select value={f.tipo} onChange={ev=>set("tipo",ev.target.value)}><option value="preventiva">Preventiva</option><option value="corretiva">Corretiva</option><option value="calibracao">Calibração</option></select></div>
      {f.tipo==="calibracao" && <div className="field full"><label>Nova validade da calibração</label><input type="date" value={f.calibracao_validade} onChange={ev=>set("calibracao_validade",ev.target.value)} /></div>}
      <div className="field"><label>Empresa/técnico</label><input value={f.empresa} onChange={ev=>set("empresa",ev.target.value)} /></div>
      <div className="field"><label>Custo (R$)</label><input type="number" step="0.01" value={f.custo} onChange={ev=>set("custo",ev.target.value)} /></div>
      <div className="field full"><label>Observações</label><input value={f.obs} onChange={ev=>set("obs",ev.target.value)} /></div>
    </div>
    <div className="note" style={{marginTop:8}}>Ao salvar, a "última manutenção" vira esta data e a próxima é recalculada pela periodicidade.</div>
    <div className="modal-actions"><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={submit}>Salvar</button></div>
  </div></div>);
}

/* ===== casca com abas ===== */
function App(){
  const [aba,setAba]=useState("temperatura");
  return (
    <div className="wrap">
      <div className="top">
        <div className="brand"><h1>Equipamentos</h1><p>{aba==="temperatura"?"Temperatura de geladeiras e freezers — imunobiológicos e amostras":"Manutenção preventiva e calibração — ultrassom, autoclave, centrífuga…"}</p></div>
        <span className={"mode " + (sb ? "live" : "demo")}>{sb ? "● Conectado ao Supabase" : "○ Modo demo — nada é salvo"}</span>
      </div>
      <div className="etabs">
        <button className={aba==="temperatura"?"on":""} onClick={()=>setAba("temperatura")}>Temperatura</button>
        <button className={aba==="manutencao"?"on":""} onClick={()=>setAba("manutencao")}>Manutenção</button>
      </div>
      {aba==="temperatura" ? <AppTemperatura embutido /> : <AppManutencao />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
