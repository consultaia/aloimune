<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dri · WhatsApp</title>
<!-- ==========================================================================
     DRI · WHATSAPP — painel da recepcionista virtual.
       • Fila "precisa de atendente": conversas que a Dri passou para um humano
         (conversas.atendente = true), com motivo e últimas mensagens.
       • Números do mês: conversas, consultas marcadas pela Dri, lembretes e
         confirmações enviadas, custo estimado na Meta.
       • Status da conexão (pergunta ao Worker) e explicação de quem paga o quê.
     Rode dri-painel.sql (libera leitura/edição de `conversas` para gestor,
     recepcionista e auditoria). WORKER_URL = o Worker da Dri.
     ========================================================================== -->
<script>
  const SUPABASE_URL = "https://lnzvkfbcpnfmfvbdafab.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuenZrZmJjcG5mbWZ2YmRhZmFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODg2OTgsImV4cCI6MjA5NTA2NDY5OH0.EE1PF8moQPawVpsrM87iKa8IrD2yJ6tYKb0zAl17tbg";
  const WORKER_URL = "https://dri-clinica.janan-almeida.workers.dev";
  const CUSTO_MSG = 0.05; // R$ estimado por mensagem "utilidade" enviada pela clínica (Meta, Brasil)
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#12212B; --surface:#F5F7F8; --card:#FFFFFF; --line:#E1E7EA; --muted:#5C6B75;
    --primary:#0E7C7B; --primary-ink:#0A5A59; --ok:#2E7D5B; --ok-bg:#E7F4EE; --warn:#B26B00; --warn-bg:#FAEED4;
    --bad:#C0392B; --bad-bg:#FBE5E2; --blue:#1F6FB2; --blue-bg:#E4EFF7; --wa:#25D366; --wa-bg:#DCF8C6;
    --radius:12px; --shadow:0 1px 2px rgba(18,33,43,.06),0 8px 24px rgba(18,33,43,.05); }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--surface);font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .brand h1{font-family:"Space Grotesk";font-weight:700;font-size:26px;margin:0}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
  .mode{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
  .mode.demo{background:var(--warn-bg);color:var(--warn)} .mode.live{background:var(--ok-bg);color:var(--ok)} .mode.off{background:var(--bad-bg);color:var(--bad)}
  .tabs{display:flex;gap:4px;background:#E9EEF0;padding:4px;border-radius:10px;margin-bottom:16px;width:max-content;max-width:100%;overflow:auto}
  .tabs button{font:inherit;font-weight:600;font-size:13.5px;border:none;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .tabs .badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;margin-left:6px;line-height:18px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  @media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;border-left-width:4px;border-left-color:var(--primary)}
  .tile .l{font-size:12px;color:var(--muted);font-weight:500}
  .tile .v{font-family:"Space Grotesk";font-weight:700;font-size:23px;margin-top:6px;font-variant-numeric:tabular-nums}
  .tile .s{font-size:12px;color:var(--muted);margin-top:4px}
  .t-ok{border-left-color:var(--ok)} .t-bad{border-left-color:var(--bad)} .t-bad .v{color:var(--bad)} .t-blue{border-left-color:var(--blue)}
  .btn{font:inherit;font-weight:600;padding:9px 15px;border-radius:9px;border:1px solid transparent;cursor:pointer;text-decoration:none;display:inline-block}
  .btn-primary{background:var(--primary);color:#fff} .btn-primary:disabled{opacity:.5}
  .btn-wa{background:var(--wa);color:#063}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)} .btn-ghost:hover{border-color:var(--muted)}
  .btn-sm{padding:5px 10px;font-size:13px;font-weight:500}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
  .panel h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .panel .body{padding:16px}
  .conv{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px}
  .conv:last-child{border-bottom:none}
  .conv .tel{font-family:"Space Grotesk";font-weight:700;font-size:16px}
  .conv .motivo{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:6px}
  .conv .quando{font-size:12px;color:var(--muted);margin-top:2px}
  .hist{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-width:640px}
  .b{padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;max-width:85%;white-space:pre-wrap}
  .b.user{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
  .b.model{background:var(--wa-bg);align-self:flex-end;border-bottom-right-radius:3px}
  .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .exp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:760px){.exp{grid-template-columns:1fr}}
  .exp .card{border:1px solid var(--line);border-radius:10px;padding:14px}
  .exp .card h4{margin:0 0 6px;font-size:14px}
  .exp .card p,.exp .card li{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0}
  .exp .card ul{margin:6px 0 0;padding-left:18px}
  .price{font-family:"Space Grotesk";font-weight:700;color:var(--ink)}
  .msg{padding:10px 14px;border-radius:9px;font-size:13.5px;margin-bottom:12px}
  .msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .steps{counter-reset:s;display:flex;flex-direction:column;gap:10px}
  .step{display:flex;gap:12px;align-items:flex-start}
  .step::before{counter-increment:s;content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .step p{margin:0;font-size:13.5px;line-height:1.5}
  .step b{display:block;color:var(--ink)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const configurado = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = configurado ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const fmtTel = (t)=>{ const d=String(t||"").replace(/\D/g,""); if(d.length===13) return `+${d.slice(0,2)} (${d.slice(2,4)}) ${d.slice(4,9)}-${d.slice(9)}`; if(d.length===12) return `+${d.slice(0,2)} (${d.slice(2,4)}) ${d.slice(4,8)}-${d.slice(8)}`; return t||"—"; };
const fmtDT = (iso)=> iso ? new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
const brl = (v)=> (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const mesIni = ()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; };

const DEMO = {
  fila:[{ telefone:"5571999990000", motivo:"quer saber o resultado do exame", atualizado_em:new Date(Date.now()-35*60000).toISOString(),
    historico:[{role:"user",text:"oi, meu exame de progesterona já saiu?"},{role:"model",text:"Oi! Sou a Dri, assistente da clínica. Com quem eu falo?"},{role:"user",text:"Mariana"},{role:"model",text:"Mariana, resultado de exame eu não consigo ver por aqui. Vou passar pra uma atendente da clínica te responder em breve, tá? 💙"}]}],
  stats:{ conversas:37, marcadas:19, lembretes:11, confirmacoes:26, erros:0 }
};

function App(){
  const [papel,setPapel]=useState(null);
  const [fila,setFila]=useState([]); const [stats,setStats]=useState(null); const [status,setStatus]=useState(null);
  const [tab,setTab]=useState("fila"); const [msg,setMsg]=useState(null); const [erroRLS,setErroRLS]=useState(false);
  const demo=!configurado;

  async function carregar(){
    if(demo){ setFila(DEMO.fila); setStats(DEMO.stats); setStatus({whatsapp:false, ia:true, demo:true}); return; }
    const { data:{ user } } = await sb.auth.getUser();
    if(user){ const { data:pf } = await sb.from("perfis").select("papel").eq("id",user.id).maybeSingle(); setPapel(pf?.papel||null); }
    const ini=mesIni();
    const [c, f, ag, lem, conf] = await Promise.all([
      sb.from("conversas").select("telefone",{count:"exact",head:true}).gte("atualizado_em",ini),
      sb.from("conversas").select("telefone,motivo,atualizado_em,historico").eq("atendente",true).order("atualizado_em",{ascending:false}).limit(50),
      sb.from("agendamentos").select("id",{count:"exact",head:true}).eq("origem","dri").gte("data",ini),
      sb.from("clinica_mensagens_programadas").select("id,status").gte("enviada_em",ini),
      sb.from("agendamentos").select("id",{count:"exact",head:true}).gte("confirmacao_enviada_em",ini),
    ]);
    if(f.error){ setErroRLS(true); setFila([]); } else setFila(f.data||[]);
    const lems=(lem.data||[]);
    setStats({ conversas:c.count||0, marcadas:ag.count||0, lembretes:lems.filter(x=>x.status==="enviada").length, erros:lems.filter(x=>x.status==="erro").length, confirmacoes:conf.count||0 });
  }
  async function pingar(){
    try{ const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"status"})}); const j=await r.json(); setStatus(j); }
    catch(e){ setStatus({erro:String(e)}); }
  }
  useEffect(()=>{ carregar(); if(!demo) pingar(); },[]);

  async function resolver(cv){
    if(demo){ setFila(f=>f.filter(x=>x.telefone!==cv.telefone)); return; }
    const { error } = await sb.from("conversas").update({ atendente:false, motivo:null }).eq("telefone",cv.telefone);
    if(error){ setMsg({t:"bad",x:"Não consegui marcar como resolvido: "+error.message}); return; }
    setFila(f=>f.filter(x=>x.telefone!==cv.telefone)); setMsg({t:"ok",x:"Conversa marcada como resolvida. A Dri volta a atender esse número."});
  }

  const [auto,setAuto]=useState(null); const [rodando,setRodando]=useState(false);
  async function rodarAutoteste(){
    if(demo){ setAuto({ok:true,etapas:[{etapa:"Modo demonstração",ok:true,detalhe:"sem banco real"}]}); return; }
    setRodando(true); setAuto(null);
    try{ const { data:{ session } } = await sb.auth.getSession();
      const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json",authorization:"Bearer "+(session?.access_token||"")},body:JSON.stringify({action:"autoteste"})});
      const j=await r.json(); setAuto(j.error?{ok:false,etapas:[{etapa:"Autoteste",ok:false,detalhe:j.error}]}:j);
    }catch(e){ setAuto({ok:false,etapas:[{etapa:"Falar com o Worker",ok:false,detalhe:String(e)}]}); }
    setRodando(false);
  }
  const custoMes = stats ? (stats.lembretes+stats.confirmacoes)*CUSTO_MSG : 0;
  const conectado = status && status.whatsapp;

  return (
    <div className="wrap">
      <div className="top">
        <div className="brand"><h1>Dri · WhatsApp</h1><p>A recepcionista virtual: quem precisa de gente, os números do mês e o que a clínica paga.</p></div>
        <span className={"mode "+(demo?"demo":conectado?"live":"off")}>{demo?"Modo demonstração":conectado?"WhatsApp oficial conectado":status?"Só simulador — WhatsApp ainda não ligado":"Verificando…"}</span>
      </div>
      {msg && <div className={"msg "+msg.t} onClick={()=>setMsg(null)}>{msg.x}</div>}
      {erroRLS && <div className="msg warn">Sem permissão para ler as conversas da Dri. Rode <b>dri-painel.sql</b> no Supabase (libera gestor, recepcionista e auditoria).</div>}

      <div className="tabs">
        <button className={tab==="fila"?"on":""} onClick={()=>setTab("fila")}>Precisa de atendente{fila.length>0 && <span className="badge">{fila.length}</span>}</button>
        <button className={tab==="mes"?"on":""} onClick={()=>setTab("mes")}>Este mês</button>
        <button className={tab==="como"?"on":""} onClick={()=>setTab("como")}>Como funciona e custos</button>
      </div>

      {tab==="fila" && <div className="panel">
        <h3>Conversas que a Dri passou para um humano</h3>
        {fila.length===0 ? <div className="empty">Nenhuma conversa aguardando. A Dri está dando conta sozinha 🙂</div> :
          fila.map(cv=>(
            <div className="conv" key={cv.telefone}>
              <div>
                <span className="tel">{fmtTel(cv.telefone)}</span>{cv.motivo && <span className="motivo">{cv.motivo}</span>}
                <div className="quando">última mensagem {fmtDT(cv.atualizado_em)}</div>
                <div className="hist">{(cv.historico||[]).slice(-6).filter(h=>!/^Enviei /.test(h.text||"")).map((h,i)=><div key={i} className={"b "+(h.role==="user"?"user":"model")}>{h.text}</div>)}</div>
              </div>
              <div className="acts">
                <a className="btn btn-wa btn-sm" href={"https://wa.me/"+String(cv.telefone).replace(/\D/g,"")} target="_blank" rel="noreferrer">Responder no WhatsApp</a>
                <button className="btn btn-ghost btn-sm" onClick={()=>resolver(cv)}>Resolvido — Dri pode voltar</button>
              </div>
            </div>
          ))}
      </div>}

      {tab==="mes" && stats && <>
        <div className="tiles">
          <div className="tile t-blue"><div className="l">Conversas atendidas pela Dri</div><div className="v">{stats.conversas}</div><div className="s">números diferentes que falaram com ela</div></div>
          <div className="tile t-ok"><div className="l">Consultas marcadas por ela</div><div className="v">{stats.marcadas}</div><div className="s">sem ninguém da recepção</div></div>
          <div className="tile"><div className="l">Lembretes de retorno enviados</div><div className="v">{stats.lembretes}</div><div className="s">{stats.erros?`${stats.erros} com erro`:"todos entregues"}</div></div>
          <div className="tile"><div className="l">Confirmações 24 h antes</div><div className="v">{stats.confirmacoes}</div><div className="s">enviadas automaticamente</div></div>
        </div>
        <div className="panel"><h3>Custo estimado na Meta neste mês</h3><div className="body">
          <p style={{margin:0,fontSize:15}}><span className="price" style={{fontSize:26}}>{brl(custoMes)}</span> &nbsp;≈ {stats.lembretes+stats.confirmacoes} mensagens iniciadas pela clínica × {brl(CUSTO_MSG)}.</p>
          <p style={{margin:"8px 0 0",fontSize:13.5,color:"var(--muted)"}}>As {stats.conversas} conversas iniciadas pelas pacientes custaram <b>R$ 0</b>. A inteligência artificial (Gemini) está dentro da mensalidade da plataforma. O valor exato aparece na fatura da conta Meta da clínica.</p>
        </div></div>
      </>}

      {tab==="como" && <>
        <div className="panel"><h3>Quem paga o quê</h3><div className="body exp">
          <div className="card"><h4>Paciente escreve para a clínica → <span className="price">R$ 0</span></h4><p>A Meta não cobra conversas iniciadas pela paciente. A Dri pode responder à vontade por 24 h a partir de cada mensagem dela. É a maior parte do uso.</p></div>
          <div className="card"><h4>Clínica escreve primeiro → <span className="price">centavos</span></h4><p>Lembrete de retorno e confirmação 24 h antes são mensagens "de utilidade" enviadas por modelo aprovado pela Meta. No Brasil, cerca de {brl(CUSTO_MSG)} cada. 300 por mês ≈ {brl(300*CUSTO_MSG)}.</p></div>
          <div className="card"><h4>Conta Meta → <span className="price">no cartão da clínica</span></h4><p>O número e a conta WhatsApp Business são da clínica (CNPJ dela). A fatura da Meta cai no cartão cadastrado por ela; a plataforma só usa a conta. Se a clínica preferir, a ConsultaIA paga e repassa na mensalidade.</p></div>
          <div className="card"><h4>IA e plataforma → <span className="price">mensalidade</span></h4><p>Gemini, servidores, atualizações e suporte estão na mensalidade. Não há cobrança por conversa nem por consulta marcada.</p></div>
        </div></div>
        <div className="panel"><h3>Como liga o WhatsApp oficial (uma vez só)</h3><div className="body steps">
          <div className="step"><p><b>Um número para a Dri</b>Chip novo ou o número atual da clínica (aí o WhatsApp comum daquele número deixa de existir — vira só a Dri). Recomendado: número novo, e o atual avisa "para marcar, fale com a Dri".</p></div>
          <div className="step"><p><b>Conta Meta Business verificada</b>Com o CNPJ da clínica, em business.facebook.com. A Meta leva de 1 a 5 dias úteis para verificar.</p></div>
          <div className="step"><p><b>Dois modelos de mensagem aprovados</b>"lembrete_retorno" e "confirmacao_consulta", com o texto que a Dri usa quando escreve primeiro. Aprovação em minutos a 24 h.</p></div>
          <div className="step"><p><b>Ligar o número ao cérebro da Dri</b>Colamos o token e o ID do número no Worker e apontamos o webhook da Meta para ele. A partir daí, tudo que chega no número passa pela Dri.</p></div>
          <div className="step"><p><b>Testar com a recepção</b>Marcar, remarcar, mandar áudio, pedir atendente. Só depois divulgar o número.</p></div>
        </div></div>
        <div className="panel"><h3>Autoteste antes de demonstrar</h3><div className="body">
          <p style={{margin:"0 0 10px",fontSize:13.5,color:"var(--muted)"}}>Grava uma consulta de teste na agenda real, confere que ela aparece, apaga, e pede à IA uma marcação em JSON. Se tudo ficar verde, a Dri está pronta para marcar ao vivo. Leva uns 10 segundos.</p>
          <button className="btn btn-primary" onClick={rodarAutoteste} disabled={rodando}>{rodando?"Rodando…":"Rodar autoteste agora"}</button>
          {auto && <div style={{marginTop:12}}>
            <div className={"msg "+(auto.ok?"ok":"bad")} style={{marginBottom:8}}>{auto.ok?"✅ Tudo verde — pode demonstrar.":"❌ Algo falhou — não demonstre antes de corrigir o item vermelho."}</div>
            <ul style={{margin:0,paddingLeft:18,fontSize:13.5,lineHeight:1.7}}>{(auto.etapas||[]).map((e,i)=><li key={i} style={{color:e.ok?"var(--ok)":"var(--bad)"}}>{e.ok?"✅":"❌"} {e.etapa}{e.detalhe?<span style={{color:"var(--muted)"}}> — {e.detalhe}</span>:null}</li>)}</ul>
          </div>}
        </div></div>
        <div className="panel"><h3>Estado da conexão agora</h3><div className="body">
          {demo ? <p style={{margin:0,color:"var(--muted)"}}>Modo demonstração.</p> :
           !status ? <p style={{margin:0,color:"var(--muted)"}}>Consultando o Worker…</p> :
           status.erro ? <p style={{margin:0,color:"var(--bad)"}}>Não consegui falar com o Worker: {status.erro}</p> :
           <ul style={{margin:0,paddingLeft:18,fontSize:14,lineHeight:1.7}}>
             <li>Cérebro da Dri (IA): {status.ia?"✅ ativo":"❌ sem chave"}</li>
             <li>WhatsApp oficial (Meta): {status.whatsapp?"✅ conectado":"⏳ ainda não ligado — a Dri funciona só pelo simulador"}</li>
             <li>Modelos de mensagem: {status.modelos ? status.modelos.join(", ") : "—"}</li>
             <li>Nome da clínica na conversa: {status.clinica||"clínica"}</li>
           </ul>}
        </div></div>
      </>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
