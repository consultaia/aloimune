<style>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const DIAG = /[?&]diag=1/.test(location.search);   // ?diag=1 => mostra as distâncias do reconhecimento na tela
const DEMO_URL = /[?&]demo=1/.test(location.search); // demonstração: sem banco, sem logo da clínica, nada é salvo
const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && !DEMO_URL) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const dist=(a,b)=>{let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d;}return Math.sqrt(s);};
const hora=()=> new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const demoBatidas=[]; // modo demo: batidas desta sessão
// Opções de batida conforme o que a pessoa já bateu hoje. No banco continua "entrada"/"saida";
// o espelho reconhece o almoço pela ordem (entrada → saída almoço → volta almoço → saída).
function opcoesDoDia(hoje){
  const n=hoje.length, ult=n ? hoje[n-1].tipo : null;
  if(ult==="entrada" && n===1) return { msg:"Saindo para o almoço ou encerrando o dia?",
    botoes:[{tipo:"saida",rot:"Saída para ALMOÇO",feito:"Saída para almoço",sug:true},{tipo:"saida",rot:"Saída — fim do dia",feito:"Saída"}], alt:{tipo:"entrada",rot:"registrar entrada"} };
  if(ult==="saida" && n===2) return { msg:"Voltando do almoço?",
    botoes:[{tipo:"entrada",rot:"VOLTA do almoço",feito:"Volta do almoço",sug:true},{tipo:"saida",rot:"Registrar SAÍDA",feito:"Saída"}] };
  if(ult==="entrada") return { botoes:[{tipo:"saida",rot:"Registrar SAÍDA",feito:"Saída",sug:true},{tipo:"entrada",rot:"Registrar ENTRADA",feito:"Entrada"}] };
  return { botoes:[{tipo:"entrada",rot:"Registrar ENTRADA",feito:"Entrada",sug:true},{tipo:"saida",rot:"Registrar SAÍDA",feito:"Saída"}] };
}

// relógio do repouso: se ele parar de andar, a página travou (ajuda a diagnosticar)
function RelogioRepouso(){ const [t,setT]=useState(hora());
  useEffect(()=>{const i=setInterval(()=>setT(hora()),1000);return ()=>clearInterval(i);},[]);
  return <span>{t}</span>; }
// recarrega o ponto (autocorreção). Guarda o motivo para mostrar depois e evita recarregar em loop.
function recarregar(motivo){
  try{
    const ult=Number(sessionStorage.getItem("ponto_reload_em")||0);
    if(Date.now()-ult<60000) return;           // no máximo 1 vez por minuto
    sessionStorage.setItem("ponto_reload_em",String(Date.now()));
    localStorage.setItem("ponto_ultimo_reload",new Date().toLocaleString("pt-BR")+" — "+motivo);
  }catch(_){}
  location.reload();
}
function Relogio(){ const [t,setT]=useState(hora());
  useEffect(()=>{const i=setInterval(()=>setT(hora()),1000);return ()=>clearInterval(i);},[]);
  return <div className="clock">{t}</div>; }

function Login({ onIn }){
  const EMAIL_QUIOSQUE="quiosque@clinica.local";
  const [outro,setOutro]=useState(false);
  const [email,setEmail]=useState(EMAIL_QUIOSQUE); const [senha,setSenha]=useState("");
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  async function entrar(){ setErr(""); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: outro?email:EMAIL_QUIOSQUE, password:senha });
    setBusy(false); if(error){ setErr("Senha incorreta. A senha do quiosque é definida pela gestora em Ponto → Quiosque."); return; } onIn(); }
  return (
    <div className="kiosk"><div className="login">
      <h1>Ativar o quiosque</h1>
      <p>Só na primeira vez neste aparelho. Digite a <b>senha do quiosque</b> (definida em Ponto → Quiosque) e ele fica ativado.</p>
      {err && <div className="err">{err}</div>}
      {outro && <input type="email" placeholder="e-mail da conta" value={email} onChange={e=>setEmail(e.target.value)} />}
      <input type="password" inputMode="numeric" placeholder="senha do quiosque" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()} autoFocus />
      <button onClick={entrar} disabled={busy}>{busy?"Ativando…":"Ativar"}</button>
      <div style={{marginTop:12,fontSize:12,opacity:.7,cursor:"pointer"}} onClick={()=>setOutro(!outro)}>{outro?"usar a conta padrão do quiosque":"entrar com outra conta"}</div>
    </div></div>
  );
}

function Kiosk(){
  const videoRef=useRef(null);
  const [fase,setFase]=useState("carregando"); // carregando | scan | confirmar | pin | salvando | feito | erro
  const [erro,setErro]=useState("");
  const [pessoa,setPessoa]=useState(null); const pessoaRef=useRef(null); pessoaRef.current=pessoa;      // {colaborador_id, nome, metodo}
  const [sugestao,setSugestao]=useState("entrada");
  const [opcoes,setOpcoes]=useState(opcoesDoDia([]));
  const [pin,setPin]=useState("");
  const [feito,setFeito]=useState(null);        // {nome, tipo}
  const enrolled=useRef([]);                     // [{colaborador_id, nome, descritor:[...]}]
  const scanning=useRef(false);
  const timer=useRef(null);
  const [dormindo,setDormindo]=useState(false);
  const ultimaAtiv=useRef(Date.now());
  const motionTimer=useRef(null); const prevFrame=useRef(null); const motionCanvas=useRef(null);
  const atividade=()=>{ ultimaAtiv.current=Date.now(); };

  const [camOn,setCamOn]=useState(false); const [precisaToque,setPrecisaToque]=useState(false);
  // o iPhone desliga a câmera quando a tela bloqueia, o app vai para segundo plano ou chega uma ligação,
  // e a imagem fica preta. Aqui a câmera é religada sozinha quando isso acontece.
  // parada = trilha encerrada, sem imagem, ou imagem congelada (o tempo do vídeo não anda)
  const ultTempo=useRef({ t:-1, falhas:0 });
  const cameraViva=()=>{ const st=streamRef.current, v=videoRef.current; const tr=st && st.getVideoTracks()[0];
    if(!tr || tr.readyState!=="live" || !v || v.videoWidth===0) return false;
    const andou = v.currentTime!==ultTempo.current.t; ultTempo.current.t=v.currentTime;
    return andou || v.paused; };  // pausado é tratado com play(), sem religar
  async function garantirCamera(){
    // se já pediu toque em "Ligar câmera", espera a pessoa tocar (não fica pedindo permissão em loop)
    if(religando.current || precisaToqueRef.current || document.visibilityState!=="visible") return;
    const v=videoRef.current;
    if(v && v.paused && streamRef.current){ try{ await v.play(); }catch(_){} }
    if(cameraViva()){ ultTempo.current.falhas=0; return; }
    // só religa depois de 2 conferências seguidas com a câmera parada (evita religar à toa no iPhone)
    if(++ultTempo.current.falhas<2) return;
    ultTempo.current.falhas=0;
    religando.current=true; try{ await ligarCamera(); } finally { religando.current=false; }
  }
  useEffect(()=>{
    if(fase==="carregando") return;
    const id=setInterval(garantirCamera,4000);
    const vis=()=>{ if(document.visibilityState==="visible") setTimeout(garantirCamera,500); };
    document.addEventListener("visibilitychange",vis); window.addEventListener("pageshow",vis);
    return ()=>{ clearInterval(id); document.removeEventListener("visibilitychange",vis); window.removeEventListener("pageshow",vis); };
  },[fase]);
  // mantém a tela acesa enquanto o ponto está aberto: o aparelho não bloqueia sozinho (e não pede a senha de desbloqueio)
  useEffect(()=>{
    let lock=null;
    const pedir=async()=>{ try{ if(navigator.wakeLock && !lock && document.visibilityState==="visible"){ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{ lock=null; }); } }catch(_){} };
    const vis=()=>{ if(document.visibilityState==="visible") pedir(); };
    pedir(); document.addEventListener("visibilitychange",vis); document.addEventListener("pointerdown",pedir);
    return ()=>{ document.removeEventListener("visibilitychange",vis); document.removeEventListener("pointerdown",pedir); if(lock) lock.release().catch(()=>{}); };
  },[]);
  const streamRef=useRef(null); const religando=useRef(false); const precisaToqueRef=useRef(false); precisaToqueRef.current=precisaToque;
  async function ligarCamera(){
    try{
      if(streamRef.current){ streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current=null; }
      const stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" }, audio:false });
      streamRef.current=stream;
      const v=videoRef.current;
      if(v){ v.srcObject=stream; v.muted=true; v.playsInline=true; v.setAttribute("playsinline","");
        try{ await v.play(); }catch(_){ }
        let n=0; const chk=()=>{ n++; if(v.videoWidth>0){ setCamOn(true); setPrecisaToque(false); }
          else if(n<25){ setTimeout(chk,150); } else { setPrecisaToque(true); } };
        chk();
      }
    }catch(e){ setErro("Não consegui a câmera ("+(e.name||"")+"). Toque em 'Ligar câmera' ou use o PIN."); setPrecisaToque(true); }
  }
  // Carrega o reconhecimento facial. Antes tentava uma vez só: se a internet falhasse naquele instante
  // (ex.: Wi-Fi acordando), o ponto ficava o dia todo sem reconhecer. Agora tenta de novo sozinho.
  const tentativasModelo=useRef(0);
  async function carregarModelo(){
    if(faceapi.nets.faceRecognitionNet.isLoaded) return true;
    tentativasModelo.current++;
    try{
      if(faceapi.tf && faceapi.tf.ready) await faceapi.tf.ready();
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      setFalha(f=> f.startsWith("Reconhecimento facial indisponível") ? "" : f);
      return true;
    }catch(e){
      // na 2ª falha, tenta o processamento alternativo (sem placa de vídeo)
      setFalha("Reconhecimento facial indisponível agora ("+(e && e.message || e)+"). Tentando de novo… Use o PIN.");
      return false;
    }
  }
  useEffect(()=>{ const id=setInterval(()=>{ if(window.faceapi && !faceapi.nets.faceRecognitionNet.isLoaded) carregarModelo(); },30000); return ()=>clearInterval(id); },[]);
  async function iniciar(){
    if(!window.faceapi) setFalha("Não consegui baixar o reconhecimento facial. Verifique a internet e feche e abra o app. Use o PIN.");
    // não segura a tela esperando: se falhar, tenta de novo em 5 s, 10 s, 20 s (e depois a cada 30 s)
    else if(!(await carregarModelo())) [5000,15000,35000].forEach(t=>setTimeout(()=>{ if(!faceapi.nets.faceRecognitionNet.isLoaded) carregarModelo(); },t));
    // câmera (com confirmação de imagem; se o navegador exigir toque, mostra o botão)
    await ligarCamera();
    // rostos cadastrados
    await carregarRostos();
    setFase("scan"); loopScan();
  }

  // rostos cadastrados — recarrega de tempos em tempos para pegar quem foi apagado/cadastrado sem reabrir o app
  const rostosEm=useRef(0);
  async function carregarRostos(){
    if(!sb) return; rostosEm.current=Date.now();
    const [{ data, error }, ativos]=await Promise.all([ sb.from("ponto_biometria").select("colaborador_id,nome,descritor"), sb.from("colaboradores").select("id").eq("ativo",true) ]);
    if(error){ setFalha("Não consegui carregar os rostos cadastrados ("+error.message+"). Use o PIN."); return; }
    if(!(data||[]).length) setFalha("Nenhum rosto cadastrado encontrado — confira se o tablet está logado com o login do quiosque.");
    else setFalha("");
    // só reconhece quem continua ativo no RH (se a lista de ativos não vier, não filtra para não travar o ponto)
    const idsAtivos=new Set(((ativos&&ativos.data)||[]).map(c=>String(c.id)));
    enrolled.current=(data||[]).filter(r=>Array.isArray(r.descritor)&&r.descritor.length && (!idsAtivos.size || idsAtivos.has(String(r.colaborador_id))));
  }
  useEffect(()=>{ const id=setInterval(carregarRostos,5*60000); return ()=>clearInterval(id); },[]);
  const dormindoRef=useRef(false);
  const scanDesde=useRef(0);
  // uma leitura que não termina em 15 s = reconhecimento travado (ex.: iPhone perdeu a placa de vídeo ao
  // suspender o app). Antes isso deixava o ponto sem reconhecer ninguém, em silêncio. Agora recarrega.
  useEffect(()=>{ const id=setInterval(()=>{
      if(scanning.current && Date.now()-scanDesde.current>15000 && !pessoaRef.current) recarregar("reconhecimento travado");
    },5000); return ()=>clearInterval(id); },[]);
  // voltou depois de mais de 2 min em segundo plano (app fechado/tela bloqueada): recarrega para começar limpo
  useEffect(()=>{ let saiu=0;
    const vis=()=>{ if(document.visibilityState==="hidden") saiu=Date.now(); else if(saiu && Date.now()-saiu>120000) recarregar("voltou do segundo plano"); };
    document.addEventListener("visibilitychange",vis); return ()=>document.removeEventListener("visibilitychange",vis); },[]);
  function dormir(){
    dormindoRef.current=true;
    clearInterval(timer.current); scanning.current=false;
    setPessoa(null); setPin(""); setErro(""); setFeito(null); setFase("scan");
    setDormindo(true); iniciarMovimento();
  }
  function acordar(){
    // primeiro sai do repouso; o resto não pode impedir isso
    setDormindo(false); dormindoRef.current=false; setFase("scan");
    try{ clearInterval(motionTimer.current); prevFrame.current=null; atividade(); loopScan(); }catch(_){}
    try{ garantirCamera(); if(Date.now()-rostosEm.current>60000) carregarRostos(); }catch(_){}
  }
  // tocou para acordar e não acordou em 2 s (tela presa): recarrega o ponto sozinho
  function tocarRepouso(e){
    if(e){ e.stopPropagation(); }
    acordar();
    setTimeout(()=>{ if(dormindoRef.current) recarregar("não acordou ao toque"); },2000);
  }
  function iniciarMovimento(){
    clearInterval(motionTimer.current);
    if(!motionCanvas.current){ const c=document.createElement("canvas"); c.width=32; c.height=24; motionCanvas.current=c; }
    prevFrame.current=null;
    motionTimer.current=setInterval(()=>{
      const v=videoRef.current; if(!v||v.videoWidth===0) return;
      const c=motionCanvas.current, ctx=c.getContext("2d");
      ctx.drawImage(v,0,0,c.width,c.height);
      const cur=ctx.getImageData(0,0,c.width,c.height).data;
      if(prevFrame.current){ let d=0; for(let i=0;i<cur.length;i+=4) d+=Math.abs(cur[i]-prevFrame.current[i]);
        if(d/(cur.length/4) > 12){ acordar(); return; } }
      prevFrame.current=cur;
    }, 700);
  }
  const seq=useRef({ id:null, n:0 });      // leituras seguidas da mesma pessoa
  const rostoDesde=useRef(0);              // desde quando tem um rosto na frente da câmera
  const [dica,setDica]=useState("");
  const [falha,setFalha]=useState("");     // problema que impede o reconhecimento (mostrado na tela)
  const errosSeg=useRef(0);       // orientação na tela (chegue mais perto, use o PIN…)
  const [diag,setDiag]=useState("");
  const ignorar=useRef(null);               // depois de "não sou eu", ignora essa pessoa por 15 s
  function loopScan(){
    clearInterval(timer.current);
    timer.current=setInterval(async ()=>{
      if(scanning.current || !videoRef.current || !window.faceapi || !faceapi.nets.faceRecognitionNet.isLoaded) return;
      scanning.current=true; scanDesde.current=Date.now();
      try{
        const det=await faceapi.detectSingleFace(videoRef.current, new faceapi.TinyFaceDetectorOptions({ inputSize:320, scoreThreshold:0.4 }))
          .withFaceLandmarks().withFaceDescriptor();
        let cand=null;
        if(!det){ if(Date.now()-rostoDesde.current>2500){ rostoDesde.current=0; setDica(""); } if(DIAG) setDiag("sem rosto"); }
        if(det){ atividade();
          const v=videoRef.current;
          if(!rostoDesde.current) rostoDesde.current=Date.now();
          const tam = det.detection.box.width/(v.videoWidth||640), sc=det.detection.score;
          const bom = sc>=QUALIDADE && tam>=TAM_MIN;
          if(!bom) setDica(tam<TAM_MIN ? "Chegue mais perto da câmera" : "Fique de frente, com o rosto iluminado");
          if(DIAG && !bom) setDiag(`rosto ${Math.round(tam*100)}% · nitidez ${sc.toFixed(2)}`);
          if(bom){
            const live=Array.from(det.descriptor);
            // menor distância de cada pessoa (1º e 2º colocados são pessoas diferentes)
            const porPessoa={};
            enrolled.current.forEach(r=>{ const d=dist(live,r.descritor); const k=String(r.colaborador_id); if(!porPessoa[k]||d<porPessoa[k].d) porPessoa[k]={r,d}; });
            const ord=Object.values(porPessoa).sort((a,b)=>a.d-b.d);
            const b1=ord[0], b2=ord[1];
            const ignorada = ignorar.current && ignorar.current.id===String(b1&&b1.r.colaborador_id) && Date.now()<ignorar.current.ate;
            if(b1 && b1.d<LIMIAR && (!b2 || b2.d-b1.d>=MARGEM) && !ignorada) cand=b1.r;
            if(DIAG) setDiag(`${b1?b1.r.nome+" "+b1.d.toFixed(2):"—"} · 2º ${b2?b2.r.nome+" "+b2.d.toFixed(2):"—"} · rosto ${Math.round(tam*100)}% · nitidez ${sc.toFixed(2)} → ${cand?"OK":"não"}`);
            if(cand) setDica("Reconhecendo…");
            else setDica(Date.now()-rostoDesde.current>6000 ? "Não reconheci você. Toque em Usar PIN." : "Procurando…");
          }
        }
        // só confirma quando a mesma pessoa aparece em leituras seguidas
        const id=cand ? String(cand.colaborador_id) : null;
        seq.current = id && seq.current.id===id ? { id, n:seq.current.n+1 } : { id, n:id?1:0 };
        if(cand && seq.current.n>=SEGUIDAS){ seq.current={id:null,n:0}; await reconhecer(cand,"facial"); }
        errosSeg.current=0;
      }catch(e){
        // antes o erro era engolido em silêncio; agora aparece na tela e tenta o modo de processamento alternativo
        errosSeg.current++;
        if(errosSeg.current>=5){ setFalha("O reconhecimento facial falhou ("+(e && e.message || e)+"). Reiniciando o ponto…"); recarregar("erro na detecção: "+(e && e.message || e)); }
      }
      scanning.current=false;
    }, 600);
  }

  async function reconhecer(r, metodo){
    atividade(); setDica(""); rostoDesde.current=0;
    clearInterval(timer.current);
    // batidas de hoje (desde a meia-noite local) decidem o botão sugerido
    const ini=new Date(); ini.setHours(0,0,0,0);
    let hoje=[];
    if(sb){ const { data }=await sb.from("registros_ponto").select("tipo,momento").eq("colaborador_id",r.colaborador_id).gte("momento",ini.toISOString()).order("momento",{ascending:true});
      hoje=data||[]; }
    else hoje=demoBatidas.filter(b=>b.colaborador_id===r.colaborador_id);
    const op=opcoesDoDia(hoje);
    setPessoa({ colaborador_id:r.colaborador_id, nome:r.nome, metodo }); setOpcoes(op); setSugestao((op.botoes.find(b=>b.sug)||op.botoes[0]).tipo); setFase("confirmar");
  }

  async function registrar(tipo, rotulo){
    setFase("salvando");
    if(sb){ const { error }=await sb.from("registros_ponto").insert({ colaborador_id:pessoa.colaborador_id, tipo, metodo:pessoa.metodo });
      if(error){ setErro(error.message); setFase("erro"); return; } }
    else demoBatidas.push({ colaborador_id:pessoa.colaborador_id, tipo, momento:new Date().toISOString() });
    setFeito({ nome:pessoa.nome, tipo, rotulo: rotulo || (tipo==="entrada"?"Entrada":"Saída") }); setFase("feito");
    setTimeout(()=>{ setPessoa(null); setPin(""); setFeito(null); atividade(); setFase("scan"); loopScan(); }, 3000);
  }

  async function enviarPin(){
    if(pin.length<4) return;
    if(!sb){ // demo
      if(pin==="1234"){ await reconhecer({colaborador_id:"demo",nome:"Paula (demo)"},"pin"); }
      else { setErro("PIN não encontrado (no demo use 1234)."); setPin(""); }
      return;
    }
    const { data }=await sb.from("ponto_biometria").select("colaborador_id,nome").eq("pin",pin).maybeSingle();
    const inativo = data ? (await sb.from("colaboradores").select("ativo").eq("id",data.colaborador_id).maybeSingle()).data?.ativo===false : false;
    if(data && !inativo){ await reconhecer(data,"pin"); }
    else { setPin(""); setErro("PIN não encontrado."); setTimeout(()=>setErro(""),2500); }
  }

  useEffect(()=>{ iniciar(); return ()=>{ clearInterval(timer.current); clearInterval(motionTimer.current); }; },[]);
  useEffect(()=>{ const id=setInterval(()=>{ if(!dormindo && fase!=="carregando" && Date.now()-ultimaAtiv.current>30000) dormir(); },2000); return ()=>clearInterval(id); },[dormindo,fase]);

  const camCls = fase==="confirmar"||fase==="feito" ? "ok" : erro && fase!=="pin" ? "bad" : "";

  return (
    <div className="kiosk" onClick={()=>{ if(dormindo) acordar(); else atividade(); }} onTouchStart={()=>{ if(dormindo) acordar(); else atividade(); }}>
      <div className="brand"><span className="logo">{DEMO_URL ? <span style={{display:"inline-flex",width:28,height:28,borderRadius:8,background:"#0E7C7B",color:"#fff",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14}}>C</span> : <img src="icon-192.png" alt="Logo da clínica" />}</span> Ponto</div>
      <Relogio/>
      {dormindo && <div className="repouso" onPointerDown={tocarRepouso} onTouchStart={tocarRepouso} onClick={e=>e.stopPropagation()}><div className="rin"><div className="zz">●</div><div className="rt">Toque para bater o ponto</div><div className="rs">recepção · ponto eletrônico · <RelogioRepouso/></div></div></div>}

      {fase==="pin" ? (
        <>
          <div className="msg">Digite seu PIN</div>
          <div className="pindisp">{"•".repeat(pin.length)}</div>
          {erro && <div className="sub" style={{color:"var(--bad)"}}>{erro}</div>}
          <div className="pinpad">
            {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} className="pk" onClick={()=>setPin(p=>(p+n).slice(0,6))}>{n}</button>)}
            <button className="pk" onClick={()=>setPin("")}>↺</button>
            <button className="pk" onClick={()=>setPin(p=>(p+"0").slice(0,6))}>0</button>
            <button className="pk" onClick={enviarPin} style={{color:"var(--teal)"}}>OK</button>
          </div>
          <button className="link" onClick={()=>{setPin("");setErro("");setFase("scan");loopScan();}}>voltar ao reconhecimento</button>
        </>
      ) : (
        <>
          <div className={"camwrap "+camCls}>
            <video ref={videoRef} autoPlay playsInline muted></video>
            {precisaToque && <button className="b b-sec" style={{position:"absolute",left:"50%",top:"50%",transform:"translate(-50%,-50%)",zIndex:5}} onClick={ligarCamera}>Ligar câmera</button>}
            {fase==="scan" && <div className="scanline"></div>}
          </div>

          {fase==="carregando" && <div className="msg" style={{marginTop:26}}><div className="spin" style={{margin:"0 auto"}}></div><div style={{marginTop:14}}>Preparando…</div></div>}

          {fase==="scan" && <>
            <div className="msg">Olhe para a câmera</div>
            <div className="sub" style={falha || (dica && dica.startsWith("Não")) ? {color:"#FFD27A",fontWeight:600} : null}>{erro || falha || (enrolled.current.length===0 ? "Nenhum rosto cadastrado ainda — use o PIN por enquanto." : dica || "O reconhecimento é automático. Se não funcionar, use o PIN.")}</div>
            {DIAG && <div className="sub" style={{fontFamily:"monospace",fontSize:12,opacity:.85}}>diag: {diag} · {enrolled.current.length} rostos · {window.faceapi && faceapi.tf ? faceapi.tf.getBackend() : "sem faceapi"} · último reinício: {(()=>{ try{ return localStorage.getItem("ponto_ultimo_reload")||"nenhum"; }catch(_){ return "?"; } })()}</div>}
          </>}

          {fase==="confirmar" && pessoa && <>
            <div className="msg">Olá, <span className="big-name">{pessoa.nome}</span></div>
            {opcoes.msg && <div className="sub">{opcoes.msg}</div>}
            <div className="btns">
              {opcoes.botoes.map((b,i)=>
                <button key={i} className={"b "+(b.tipo==="entrada"?"b-entrada":"b-saida")+(b.sug?" suggest":"")+(i>0&&b.tipo===opcoes.botoes[0].tipo?" b-alt":"")} onClick={()=>registrar(b.tipo,b.feito)}>{b.rot}</button>)}
            </div>
            {opcoes.alt && <button className="link" onClick={()=>registrar(opcoes.alt.tipo)}>{opcoes.alt.rot}</button>}
            <button className="link" onClick={()=>{ if(pessoa.metodo==="facial") ignorar.current={ id:String(pessoa.colaborador_id), ate:Date.now()+15000 }; seq.current={id:null,n:0}; setPessoa(null);setFase("scan");loopScan();}}>não sou eu</button>
          </>}

          {fase==="salvando" && <div className="msg" style={{marginTop:26}}>Registrando…</div>}

          {fase==="feito" && feito && <>
            <div className="done">✓</div>
            <div className="msg">{feito.rotulo} registrada</div>
            <div className="sub">{feito.nome} · {hora()}</div>
          </>}

          {fase==="erro" && <>
            <div className="msg" style={{color:"var(--bad)"}}>Ops</div>
            <div className="sub">{erro}</div>
            <button className="link" onClick={()=>{setErro("");setFase("scan");loopScan();}}>tentar de novo</button>
          </>}

          {(fase==="scan"||fase==="carregando") &&
            <button className="b b-sec" style={{marginTop:22}} onClick={()=>{clearInterval(timer.current);setErro("");setPin("");setFase("pin");}}>Usar PIN</button>}
        </>
      )}
    </div>
  );
}

function App(){
  const [session,setSession]=useState(sb?undefined:null);
  useEffect(()=>{
    if(!sb) return;
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const { data:sub }=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(sb && session===undefined) return <div className="kiosk"><div className="spin"></div></div>;
  if(sb && !session) return <Login onIn={()=>{}} />;
  return <Kiosk/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
