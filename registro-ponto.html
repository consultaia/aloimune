<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ponto — Registro</title>

<!-- ==========================================================================
     QUIOSQUE DE PONTO (iPad)  —  reconhecimento facial + PIN de reserva
     Stack: HTML único + React 18 (CDN) + Supabase + face-api.js. Sem build.
     Rode banco-completo.sql e ponto-schema.sql. Precisa de HTTPS (GitHub Pages)
     para a câmera. Deixe o iPad neste link em tela cheia.
     Sem chaves -> modo demonstração (o PIN 1234 simula um registro).

     LGPD: o app compara apenas o "descritor" do rosto (números). Não guarda foto.
     ========================================================================== -->
<script>
  const SUPABASE_URL = "https://lnzvkfbcpnfmfvbdafab.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuenZrZmJjcG5mbWZ2YmRhZmFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODg2OTgsImV4cCI6MjA5NTA2NDY5OH0.EE1PF8moQPawVpsrM87iKa8IrD2yJ6tYKb0zAl17tbg";
  const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model";
  const LIMIAR = 0.55; // distância máxima para considerar "reconhecido" (menor = mais rígido)
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>
  :root{ --bg:#0d1b22; --card:#12242d; --line:#22404c; --ink:#eef5f7; --muted:#8fa6b0;
    --teal:#19b3a6; --ok:#2fbf71; --warn:#e0a43b; --bad:#e0603b; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100%;overflow:hidden}
  #root{height:100%}
  .kiosk{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .clock{position:fixed;top:18px;right:24px;font-family:"Space Grotesk";font-weight:700;font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums}
  .brand{position:fixed;top:18px;left:24px;display:flex;align-items:center;gap:10px;font-family:"Space Grotesk";font-weight:700;font-size:18px}
  .logo{width:32px;height:32px;border-radius:9px;background:var(--teal);color:#04231f;display:flex;align-items:center;justify-content:center;font-weight:700}

  .camwrap{position:relative;width:min(74vw,420px);aspect-ratio:1;border-radius:24px;overflow:hidden;background:#000;border:3px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .camwrap.ok{border-color:var(--ok)} .camwrap.bad{border-color:var(--bad)}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--teal),transparent);animation:scan 2.4s linear infinite;opacity:.8}
  @keyframes scan{0%{top:8%}50%{top:92%}100%{top:8%}}

  .msg{margin-top:26px;font-family:"Space Grotesk";font-weight:700;font-size:26px;max-width:620px}
  .sub{margin-top:8px;color:var(--muted);font-size:16px;max-width:560px}
  .big-name{font-size:34px;color:var(--teal)}

  .btns{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center}
  .b{font:inherit;font-weight:700;font-size:19px;padding:18px 30px;border-radius:16px;border:none;cursor:pointer;min-width:180px}
  .b-entrada{background:var(--ok);color:#04231f} .b-saida{background:var(--warn);color:#2a1c04}
  .b-sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:16px;padding:14px 22px;min-width:0}
  .b-sec:hover{border-color:var(--teal)}
  .suggest{outline:3px solid rgba(255,255,255,.25);outline-offset:2px}

  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;width:min(78vw,320px)}
  .pk{font:inherit;font-weight:700;font-size:26px;padding:18px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .pk:active{background:var(--teal);color:#04231f}
  .pindisp{font-family:"Space Grotesk";font-weight:700;font-size:40px;letter-spacing:12px;margin-top:14px;min-height:48px}

  .done{font-size:70px}
  .spin{width:48px;height:48px;border:5px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .login{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:360px}
  .login h1{font-family:"Space Grotesk";margin:0 0 6px;font-size:20px}
  .login p{color:var(--muted);margin:0 0 18px;font-size:14px}
  .login input{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:12px;background:#0b1a20;color:var(--ink)}
  .login button{width:100%;font:inherit;font-weight:700;padding:13px;border:none;border-radius:11px;background:var(--teal);color:#04231f;cursor:pointer}
  .err{background:rgba(224,96,59,.15);color:var(--bad);padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .link{background:none;border:none;color:var(--teal);font:inherit;cursor:pointer;margin-top:18px;font-size:15px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const sb = (SUPABASE_URL && SUPABASE_ANON_KEY) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const dist=(a,b)=>{let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d;}return Math.sqrt(s);};
const hora=()=> new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

function Relogio(){ const [t,setT]=useState(hora());
  useEffect(()=>{const i=setInterval(()=>setT(hora()),1000);return ()=>clearInterval(i);},[]);
  return <div className="clock">{t}</div>; }

function Login({ onIn }){
  const [email,setEmail]=useState(""); const [senha,setSenha]=useState("");
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  async function entrar(){ setErr(""); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email, password:senha });
    setBusy(false); if(error){ setErr("E-mail ou senha incorretos."); return; } onIn(); }
  return (
    <div className="kiosk"><div className="login">
      <h1>Ponto da clínica</h1>
      <p>Login do quiosque (feito uma vez neste iPad).</p>
      {err && <div className="err">{err}</div>}
      <input type="email" placeholder="e-mail" value={email} onChange={e=>setEmail(e.target.value)} />
      <input type="password" placeholder="senha" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()} />
      <button onClick={entrar} disabled={busy}>{busy?"Entrando…":"Entrar"}</button>
    </div></div>
  );
}

function Kiosk(){
  const videoRef=useRef(null);
  const [fase,setFase]=useState("carregando"); // carregando | scan | confirmar | pin | salvando | feito | erro
  const [erro,setErro]=useState("");
  const [pessoa,setPessoa]=useState(null);      // {colaborador_id, nome, metodo}
  const [sugestao,setSugestao]=useState("entrada");
  const [pin,setPin]=useState("");
  const [feito,setFeito]=useState(null);        // {nome, tipo}
  const enrolled=useRef([]);                     // [{colaborador_id, nome, descritor:[...]}]
  const scanning=useRef(false);
  const timer=useRef(null);

  async function iniciar(){
    try{
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    }catch(e){ setErro("Não consegui carregar o reconhecimento facial. Verifique a internet. Você ainda pode usar o PIN."); }
    // câmera
    try{
      const stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" }, audio:false });
      if(videoRef.current){ videoRef.current.srcObject=stream; await videoRef.current.play(); }
    }catch(e){ setErro("Não consegui acessar a câmera. Use o PIN, ou libere a câmera nas permissões."); }
    // rostos cadastrados
    if(sb){
      const { data }=await sb.from("ponto_biometria").select("colaborador_id,nome,descritor");
      enrolled.current=(data||[]).filter(r=>Array.isArray(r.descritor)&&r.descritor.length);
    }
    setFase("scan"); loopScan();
  }

  function loopScan(){
    clearInterval(timer.current);
    timer.current=setInterval(async ()=>{
      if(scanning.current || !videoRef.current || !faceapi.nets.faceRecognitionNet.isLoaded) return;
      scanning.current=true;
      try{
        const det=await faceapi.detectSingleFace(videoRef.current, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks().withFaceDescriptor();
        if(det){
          const live=Array.from(det.descriptor);
          let best=null, bestD=99;
          enrolled.current.forEach(r=>{ const d=dist(live,r.descritor); if(d<bestD){bestD=d;best=r;} });
          if(best && bestD<LIMIAR){ await reconhecer(best,"facial"); }
        }
      }catch(e){}
      scanning.current=false;
    }, 1200);
  }

  async function reconhecer(r, metodo){
    clearInterval(timer.current);
    let sug="entrada";
    if(sb){ const { data }=await sb.from("registros_ponto").select("tipo").eq("colaborador_id",r.colaborador_id).order("momento",{ascending:false}).limit(1).maybeSingle();
      sug = data?.tipo==="entrada" ? "saida" : "entrada"; }
    setPessoa({ colaborador_id:r.colaborador_id, nome:r.nome, metodo }); setSugestao(sug); setFase("confirmar");
  }

  async function registrar(tipo){
    setFase("salvando");
    if(sb){ const { error }=await sb.from("registros_ponto").insert({ colaborador_id:pessoa.colaborador_id, tipo, metodo:pessoa.metodo });
      if(error){ setErro(error.message); setFase("erro"); return; } }
    setFeito({ nome:pessoa.nome, tipo }); setFase("feito");
    setTimeout(()=>{ setPessoa(null); setPin(""); setFeito(null); setFase("scan"); loopScan(); }, 3000);
  }

  async function enviarPin(){
    if(pin.length<4) return;
    if(!sb){ // demo
      if(pin==="1234"){ setPessoa({colaborador_id:"demo",nome:"Paula (demo)",metodo:"pin"}); setSugestao("entrada"); setFase("confirmar"); }
      else { setErro("PIN não encontrado (no demo use 1234)."); setPin(""); }
      return;
    }
    const { data }=await sb.from("ponto_biometria").select("colaborador_id,nome").eq("pin",pin).maybeSingle();
    if(data){ await reconhecer(data,"pin"); }
    else { setPin(""); setErro("PIN não encontrado."); setTimeout(()=>setErro(""),2500); }
  }

  useEffect(()=>{ iniciar(); return ()=>clearInterval(timer.current); },[]);

  const camCls = fase==="confirmar"||fase==="feito" ? "ok" : erro && fase!=="pin" ? "bad" : "";

  return (
    <div className="kiosk">
      <div className="brand"><span className="logo">C</span> Ponto</div>
      <Relogio/>

      {fase==="pin" ? (
        <>
          <div className="msg">Digite seu PIN</div>
          <div className="pindisp">{"•".repeat(pin.length)}</div>
          {erro && <div className="sub" style={{color:"var(--bad)"}}>{erro}</div>}
          <div className="pinpad">
            {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} className="pk" onClick={()=>setPin(p=>(p+n).slice(0,6))}>{n}</button>)}
            <button className="pk" onClick={()=>setPin("")}>↺</button>
            <button className="pk" onClick={()=>setPin(p=>(p+"0").slice(0,6))}>0</button>
            <button className="pk" onClick={enviarPin} style={{color:"var(--teal)"}}>OK</button>
          </div>
          <button className="link" onClick={()=>{setPin("");setErro("");setFase("scan");loopScan();}}>voltar ao reconhecimento</button>
        </>
      ) : (
        <>
          <div className={"camwrap "+camCls}>
            <video ref={videoRef} playsInline muted></video>
            {fase==="scan" && <div className="scanline"></div>}
          </div>

          {fase==="carregando" && <div className="msg" style={{marginTop:26}}><div className="spin" style={{margin:"0 auto"}}></div><div style={{marginTop:14}}>Preparando…</div></div>}

          {fase==="scan" && <>
            <div className="msg">Olhe para a câmera</div>
            <div className="sub">{erro || "O reconhecimento é automático. Se não funcionar, use o PIN."}</div>
          </>}

          {fase==="confirmar" && pessoa && <>
            <div className="msg">Olá, <span className="big-name">{pessoa.nome}</span></div>
            <div className="btns">
              <button className={"b b-entrada"+(sugestao==="entrada"?" suggest":"")} onClick={()=>registrar("entrada")}>Registrar ENTRADA</button>
              <button className={"b b-saida"+(sugestao==="saida"?" suggest":"")} onClick={()=>registrar("saida")}>Registrar SAÍDA</button>
            </div>
            <button className="link" onClick={()=>{setPessoa(null);setFase("scan");loopScan();}}>não sou eu</button>
          </>}

          {fase==="salvando" && <div className="msg" style={{marginTop:26}}>Registrando…</div>}

          {fase==="feito" && feito && <>
            <div className="done">✓</div>
            <div className="msg">{feito.tipo==="entrada"?"Entrada":"Saída"} registrada</div>
            <div className="sub">{feito.nome} · {hora()}</div>
          </>}

          {fase==="erro" && <>
            <div className="msg" style={{color:"var(--bad)"}}>Ops</div>
            <div className="sub">{erro}</div>
            <button className="link" onClick={()=>{setErro("");setFase("scan");loopScan();}}>tentar de novo</button>
          </>}

          {(fase==="scan"||fase==="carregando") &&
            <button className="b b-sec" style={{marginTop:22}} onClick={()=>{clearInterval(timer.current);setErro("");setPin("");setFase("pin");}}>Usar PIN</button>}
        </>
      )}
    </div>
  );
}

function App(){
  const [session,setSession]=useState(sb?undefined:null);
  useEffect(()=>{
    if(!sb) return;
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const { data:sub }=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(sb && session===undefined) return <div className="kiosk"><div className="spin"></div></div>;
  if(sb && !session) return <Login onIn={()=>{}} />;
  return <Kiosk/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
