<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ===========================================================================
   MOTOR DE ALERTAS  —  reaproveitável.
   Recebe um item com { validade, aviso_dias, obrigatorio, arquivo_url } e
   devolve { status, dias }. A mesma função serve estoque (troque `validade`
   pela data de validade do lote), RH (férias/exames) e cadeia de frio.
   Regras:
     sem validade + obrigatório + sem arquivo -> 'pendente'  (a obter)
     sem validade                              -> 'permanente'
     dias < 0                                  -> 'vencido'
     dias <= aviso_dias                        -> 'a_vencer'
     senão                                     -> 'vigente'
   =========================================================================== */
function computeStatus(item, hoje = new Date()) {
  const obrigatorio = item.obrigatorio !== false;
  const temArquivo = !!item.arquivo_url;
  if (!item.validade) {
    return obrigatorio && !temArquivo
      ? { status: "pendente", dias: null }
      : { status: "permanente", dias: null };
  }
  const [y, m, d] = item.validade.split("-").map(Number);
  const alvo = new Date(y, m - 1, d);
  const base = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  const dias = Math.round((alvo - base) / 86400000);
  if (dias < 0) return { status: "vencido", dias };
  if (dias <= (item.aviso_dias ?? 60)) return { status: "a_vencer", dias };
  return { status: "vigente", dias };
}
window.computeStatus = computeStatus; // exposto para reuso nos outros módulos

const STATUS = {
  vencido:    { label: "Vencido",    rank: 0 },
  pendente:   { label: "A obter",    rank: 1 },
  a_vencer:   { label: "A vencer",   rank: 2 },
  vigente:    { label: "Vigente",    rank: 3 },
  permanente: { label: "Permanente", rank: 4 },
};

/* Supabase (só se configurado) */
const sb = (SUPABASE_URL && SUPABASE_ANON_KEY)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* Dados de exemplo do MODO DEMO (espelham o seed do SQL, relativos a hoje) */
function demoData() {
  const hoje = new Date();
  const rel = (n) => { const x = new Date(hoje); x.setDate(x.getDate() + n); return x.toISOString().slice(0,10); };
  const base = [
    ["Regulatório","Alvará sanitário","VISA municipal",90,65,true],
    ["Regulatório","Alvará de localização e funcionamento","Prefeitura",60,165,true],
    ["Regulatório","AVCB — Corpo de Bombeiros","Corpo de Bombeiros",90,30,true],
    ["Regulatório","CNES atualizado","DATASUS",30,null,true],
    ["Regulatório","Responsabilidade Técnica (RT) + registro no conselho","CRM",60,-5,true],
    ["Regulatório","Manual de Boas Práticas e POPs","Interno",30,null,true],
    ["Resíduos","PGRSS aprovado","VISA municipal",90,110,true],
    ["Resíduos","Contrato de coleta de resíduos de saúde","Empresa coletora",60,250,true],
    ["Infraestrutura","Controle de vetores e pragas","Empresa especializada",30,40,true],
    ["Infraestrutura","Potabilidade da água / reservatório","Laboratório",30,20,true],
    ["Terceirização","Contrato com CRHA parceiro","CRHA parceiro",90,300,true],
    ["Terceirização","Regularidade do CRHA parceiro (licença)","CRHA parceiro",60,null,true],
    ["Terceirização","Contrato de transporte de amostra biológica","Transportadora",60,200,true],
    ["Posto de coleta","Supervisor técnico — registro no conselho","Conselho",60,null,true],
    ["Posto de coleta","POPs de coleta e transporte","Interno",30,null,true],
    ["Posto de coleta","Registro de temperatura (geladeira/freezer)","Interno",15,5,true],
    ["Posto de coleta","Controle de qualidade (CIQ/CEQ)","Lab. de apoio",30,300,true],
    ["Imunologia","Cadeia de frio de imunobiológicos","Interno",15,10,true],
    ["Equipamentos","Calibração de balança / esfigmo","Metrologia",60,35,true],
    ["Equipamentos","Validação de autoclave (teste biológico)","Especializada",30,10,true],
    ["Ocupacional/RH","PCMSO / PGR","Medicina do trabalho",60,165,true],
    ["Ocupacional/RH","Imunização da equipe","Interno",60,null,true],
    ["Ocupacional/RH","Treinamento NR-32","Interno",60,265,true],
  ];
  return base.map((r, i) => ({
    id: "demo-" + i, categoria: r[0], nome: r[1], orgao: r[2], responsavel: "",
    arquivo_url: "", descricao: "", emitido_em: null,
    validade: r[4] === null ? null : rel(r[4]), aviso_dias: r[3], obrigatorio: r[5],
  }));
}

const BRL_CATS = ["Regulatório","Resíduos","Infraestrutura","Terceirização","Posto de coleta","Imunologia","Equipamentos","Ocupacional/RH","Outros"];

function Pill({ status, dias }) {
  const label = STATUS[status].label;
  let extra = "";
  if (status === "a_vencer") extra = ` · ${dias} d`;
  else if (status === "vencido") extra = ` · há ${Math.abs(dias)} d`;
  return <span className={"pill p-" + status}>{label}{extra}</span>;
}

function fmtDate(s) {
  if (!s) return "—";
  const [y, m, d] = s.split("-");
  return `${d}/${m}/${y}`;
}

function App() {
  const [docs, setDocs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState("");
  const [cat, setCat] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [sortKey, setSortKey] = useState("urgencia");
  const [editing, setEditing] = useState(null); // objeto em edição ou null
  const [modo, setModo] = useState("documentos"); // 'documentos' | 'guia'
  const hoje = new Date();

  async function load() {
    setLoading(true);
    if (sb) {
      const { data, error } = await sb.from("documentos").select("*");
      if (error) { alert("Erro ao carregar do Supabase: " + error.message); setDocs([]); }
      else setDocs(data || []);
    } else {
      setDocs(demoData());
    }
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const enriched = useMemo(() =>
    docs.map(d => ({ ...d, ...computeStatus(d, hoje) })), [docs]);

  const counts = useMemo(() => {
    const c = { vencido:0, a_vencer:0, pendente:0, vigente:0, permanente:0 };
    enriched.forEach(d => c[d.status]++);
    return c;
  }, [enriched]);

  const view = useMemo(() => {
    let list = enriched;
    if (cat) list = list.filter(d => d.categoria === cat);
    if (statusFilter) list = list.filter(d => d.status === statusFilter);
    if (q.trim()) {
      const t = q.toLowerCase();
      list = list.filter(d =>
        (d.nome||"").toLowerCase().includes(t) ||
        (d.orgao||"").toLowerCase().includes(t) ||
        (d.responsavel||"").toLowerCase().includes(t));
    }
    const sorted = [...list];
    if (sortKey === "urgencia") {
      sorted.sort((a,b) => STATUS[a.status].rank - STATUS[b.status].rank
        || (a.dias ?? 99999) - (b.dias ?? 99999));
    } else if (sortKey === "nome") {
      sorted.sort((a,b) => (a.nome||"").localeCompare(b.nome||""));
    } else if (sortKey === "validade") {
      sorted.sort((a,b) => (a.validade||"9999").localeCompare(b.validade||"9999"));
    }
    return sorted;
  }, [enriched, cat, statusFilter, q, sortKey]);

  async function save(form) {
    const payload = {
      categoria: form.categoria, nome: form.nome, orgao: form.orgao || null,
      responsavel: form.responsavel || null, arquivo_url: form.arquivo_url || null,
      descricao: form.descricao || null, emitido_em: form.emitido_em || null,
      validade: form.validade || null, aviso_dias: Number(form.aviso_dias) || 60,
      obrigatorio: !!form.obrigatorio,
    };
    if (sb) {
      let res;
      if (form.id) res = await sb.from("documentos").update(payload).eq("id", form.id);
      else res = await sb.from("documentos").insert(payload);
      if (res.error) return res.error.message;
      await load();
    } else {
      setDocs(prev => form.id
        ? prev.map(d => d.id === form.id ? { ...d, ...payload } : d)
        : [...prev, { ...payload, id: "novo-" + Date.now() }]);
    }
    setEditing(null);
    return null;
  }

  async function remove(id) {
    if (!confirm("Excluir este documento do cofre?")) return;
    if (sb) {
      const { error } = await sb.from("documentos").delete().eq("id", id);
      if (error) return alert(error.message);
      await load();
    } else {
      setDocs(prev => prev.filter(d => d.id !== id));
    }
  }

  const tiles = [
    ["vencido","Vencidos","t-bad"],
    ["a_vencer","A vencer","t-warn"],
    ["pendente","A obter","t-pend"],
    ["vigente","Vigentes","t-ok"],
    ["permanente","Permanentes","t-perm"],
  ];

  return (
    <div className="wrap">
      <div className="top">
        <div className="brand">
          <h1>Cofre de Alvará</h1>
          <p>Documentos do dossiê sanitário — validade e alerta de vencimento</p>
        </div>
        <span className={"mode " + (sb ? "live" : "demo")}>
          {sb ? "● Conectado ao Supabase" : "○ Modo demo — nada é salvo"}
        </span>
      </div>

      <div className="tabs">
        <button className={modo==="documentos"?"on":""} onClick={()=>setModo("documentos")}>Documentos</button>
        <button className={modo==="guia"?"on":""} onClick={()=>setModo("guia")}>Guia do alvará</button>
      </div>

      {modo==="guia" && <Guia docs={enriched} />}

      {modo==="documentos" && <>
      <div className="tiles">
        {tiles.map(([key,label,cls]) => (
          <button key={key}
            className={"tile " + cls + (statusFilter === key ? " active" : "")}
            onClick={() => setStatusFilter(statusFilter === key ? "" : key)}>
            <div className="n">{counts[key]}</div>
            <div className="l">{label}</div>
          </button>
        ))}
      </div>

      <div className="toolbar">
        <input placeholder="Buscar documento, órgão ou responsável…"
               value={q} onChange={e => setQ(e.target.value)} />
        <select value={cat} onChange={e => setCat(e.target.value)}>
          <option value="">Todas as categorias</option>
          {BRL_CATS.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <button className="btn btn-primary"
          onClick={() => setEditing({ categoria:"Regulatório", aviso_dias:60, obrigatorio:true })}>
          + Novo documento
        </button>
      </div>

      <div className="panel">
        {loading ? (
          <div className="empty">Carregando…</div>
        ) : view.length === 0 ? (
          <div className="empty">
            <b>Nada por aqui</b>
            {q || cat || statusFilter ? "Ajuste os filtros para ver mais." : "Adicione o primeiro documento do dossiê."}
          </div>
        ) : (
          <table>
            <thead>
              <tr>
                <th onClick={() => setSortKey("nome")}>Documento</th>
                <th>Responsável</th>
                <th onClick={() => setSortKey("validade")}>Validade</th>
                <th onClick={() => setSortKey("urgencia")}>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {view.map(d => (
                <tr key={d.id}>
                  <td>
                    <div className="doc-name">{d.nome}</div>
                    <div className="doc-meta">
                      <span className="cat">{d.categoria}</span>
                      {d.orgao || ""}
                    </div>
                  </td>
                  <td>{d.responsavel || <span style={{color:"var(--muted)"}}>—</span>}</td>
                  <td>
                    <div className="val-date">{fmtDate(d.validade)}</div>
                    {d.emitido_em && <div className="val-sub">emitido {fmtDate(d.emitido_em)}</div>}
                  </td>
                  <td><Pill status={d.status} dias={d.dias} /></td>
                  <td>
                    <div className="row-actions">
                      {d.arquivo_url &&
                        <a className="icon-link" href={d.arquivo_url} target="_blank" rel="noopener">Abrir</a>}
                      <button className="btn btn-ghost btn-sm" onClick={() => setEditing(d)}>Editar</button>
                      <button className="btn btn-ghost btn-sm" onClick={() => remove(d.id)}>Excluir</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      </>}

      {editing && <Modal doc={editing} onClose={() => setEditing(null)} onSave={save} />}
    </div>
  );
}

function Modal({ doc, onClose, onSave }) {
  const [form, setForm] = useState({
    id: doc.id, categoria: doc.categoria || "Regulatório", nome: doc.nome || "",
    orgao: doc.orgao || "", responsavel: doc.responsavel || "", arquivo_url: doc.arquivo_url || "",
    descricao: doc.descricao || "", emitido_em: doc.emitido_em || "", validade: doc.validade || "",
    aviso_dias: doc.aviso_dias ?? 60, obrigatorio: doc.obrigatorio !== false,
  });
  const [err, setErr] = useState("");
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  async function submit() {
    if (!form.nome.trim()) return setErr("Dê um nome ao documento.");
    setSaving(true);
    const e = await onSave(form);
    setSaving(false);
    if (e) setErr(e);
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h2>{doc.id ? "Editar documento" : "Novo documento"}</h2>
        {err && <div className="err">{err}</div>}
        <div className="grid">
          <div className="field full">
            <label>Nome do documento</label>
            <input value={form.nome} onChange={e => set("nome", e.target.value)}
                   placeholder="Ex.: Alvará sanitário" />
          </div>
          <div className="field">
            <label>Categoria</label>
            <select value={form.categoria} onChange={e => set("categoria", e.target.value)}>
              {BRL_CATS.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Órgão emissor</label>
            <input value={form.orgao} onChange={e => set("orgao", e.target.value)} placeholder="VISA, Bombeiros…" />
          </div>
          <div className="field">
            <label>Emitido em</label>
            <input type="date" value={form.emitido_em} onChange={e => set("emitido_em", e.target.value)} />
          </div>
          <div className="field">
            <label>Validade <span className="hint">(vazio = permanente)</span></label>
            <input type="date" value={form.validade} onChange={e => set("validade", e.target.value)} />
          </div>
          <div className="field">
            <label>Avisar com (dias de antecedência)</label>
            <input type="number" min="1" value={form.aviso_dias} onChange={e => set("aviso_dias", e.target.value)} />
          </div>
          <div className="field">
            <label>Responsável</label>
            <input value={form.responsavel} onChange={e => set("responsavel", e.target.value)} />
          </div>
          <div className="field full">
            <label>Link do arquivo (PDF)</label>
            <input value={form.arquivo_url} onChange={e => set("arquivo_url", e.target.value)}
                   placeholder="https://…" />
          </div>
          <div className="field full">
            <label>Observações</label>
            <textarea value={form.descricao} onChange={e => set("descricao", e.target.value)} />
          </div>
          <div className="field full check">
            <input type="checkbox" id="obrig" checked={form.obrigatorio}
                   onChange={e => set("obrigatorio", e.target.checked)} />
            <label htmlFor="obrig" style={{margin:0}}>Exigido no dossiê (sem arquivo, aparece como “A obter”)</label>
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={submit} disabled={saving}>
            {saving ? "Salvando…" : "Salvar documento"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ===========================================================================
   GUIA DO ALVARÁ — passo a passo para uma clínica particular de fertilidade
   + imunologia + coleta de exames, com embriologia TERCEIRIZADA (caminho leve:
   não é CRHA própria). Cada fase explica o que obter e puxa do cofre os
   documentos relacionados, marcando o que já está pronto.
   =========================================================================== */
const GUIA_FASES = [
  { t:"Base jurídica e cadastro", chaves:["localização","cnes"],
    d:"Antes de acionar a Vigilância, tenha o CNPJ, o contrato social e o alvará de localização e funcionamento da prefeitura, além do CNES atualizado. É o que abre o processo." },
  { t:"Responsabilidade técnica (RT)", chaves:["responsabilidade técnica"],
    d:"Nomeie o responsável técnico habilitado, com registro ativo no conselho (CRM). A VISA exige um RT identificado para o serviço — é peça central do dossiê." },
  { t:"Estrutura física e segurança", chaves:["avcb"],
    d:"Planta aprovada conforme a RDC 50 e o AVCB (auto de vistoria do Corpo de Bombeiros). A sala de coleta e os ambientes precisam atender aos requisitos de fluxo e biossegurança." },
  { t:"Documentação sanitária e resíduos", chaves:["boas práticas","pgrss","coleta de resíduos","vetores","potabilidade"],
    d:"Manual de Boas Práticas e POPs, PGRSS aprovado com o contrato da empresa coletora de resíduos, controle de vetores/pragas e laudo de potabilidade da água. É o coração da inspeção sanitária." },
  { t:"Equipamentos", chaves:["calibração","autoclave"],
    d:"Certificados de calibração dos equipamentos (balança, esfigmo) e validação da autoclave com teste biológico. Mantenha as validades em dia — a VISA confere na hora." },
  { t:"Terceirização da embriologia", chaves:["crha parceiro","regularidade do crha","transporte de amostra"],
    d:"Como a FIV/embriologia é terceirizada, comprove o contrato com o CRHA parceiro e a regularidade (licença) dele, além do transporte de amostra biológica. É isso que mantém sua clínica no caminho leve, sem precisar de licença de banco própria." },
  { t:"Posto de coleta (RDC 978/2025)", chaves:["supervisor técnico","pops de coleta","controle de temperatura","controle de qualidade"],
    d:"Supervisor técnico de nível superior, POPs de coleta e transporte, registro de temperatura das geladeiras e controle de qualidade (CIQ/CEQ) com o laboratório de apoio." },
  { t:"Saúde ocupacional e equipe", chaves:["pcmso","imunização","nr-32"],
    d:"PCMSO/PGR em dia, comprovantes de imunização da equipe e treinamento NR-32. Protege a equipe e é item cobrado no licenciamento." },
  { t:"Protocolo e inspeção na VISA", chaves:["alvará sanitário"],
    d:"Com o dossiê completo, protocole o requerimento na Vigilância Sanitária municipal. Antes da visita, rode uma autoinspeção com o roteiro da VISA — chegar preparado encurta muito o prazo. O alvará sanitário é o resultado final de tudo acima." },
];

function Guia({ docs }){
  const pronto = (d)=> d.status==="vigente" || d.status==="permanente";
  const obrig = docs.filter(d=> d.obrigatorio!==false);
  const prontos = obrig.filter(pronto).length;
  const pct = obrig.length ? Math.round(prontos/obrig.length*100) : 0;

  const fases = GUIA_FASES.map(f=>{
    const rel = docs.filter(d=> f.chaves.some(k=> (d.nome||"").toLowerCase().includes(k)));
    const temPendencia = rel.some(d=> d.status==="pendente" || d.status==="vencido");
    const tudoPronto = rel.length>0 && rel.every(pronto);
    const cls = tudoPronto ? "ok" : (rel.some(d=>d.status==="vencido") ? "bad" : "pend");
    const stTxt = rel.length===0 ? "" : tudoPronto ? "concluído" : `${rel.filter(pronto).length}/${rel.length} prontos`;
    return { ...f, rel, cls, stTxt };
  });

  return (
    <div>
      <div className="guia-intro">
        <h2>Guia do alvará sanitário</h2>
        <p>Roteiro sob medida para esta clínica (particular, fertilidade + imunologia + coleta, com embriologia terceirizada). Siga as fases; cada documento aqui é o mesmo do cofre — o que você anexa lá vai ficando verde aqui.</p>
        <div className="prog"><span style={{width:pct+"%"}}></span></div>
        <div className="prog-txt">{prontos} de {obrig.length} documentos obrigatórios prontos ({pct}%)</div>
      </div>

      {fases.map((f,i)=>(
        <div className={"fase "+f.cls} key={i}>
          <div className="fh">
            <span className="num">{i+1}</span>
            <span className="ft">{f.t}</span>
            {f.stTxt && <span className="fstatus">{f.stTxt}</span>}
          </div>
          <div className="fdesc">{f.d}</div>
          {f.rel.length>0 &&
            <div className="docs">
              {f.rel.map(d=>(
                <div className="docline" key={d.id}>
                  <Pill status={d.status} dias={d.dias} />
                  <span className="dn">{d.nome}</span>
                </div>
              ))}
            </div>}
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
