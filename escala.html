<title>Escala</title>
<!-- ==========================================================================
     ESCALA (horário administrativo, toda a equipe)
     - Pessoas vêm do RH (colaboradores) com carga horária e regime.
     - Gera a grade de dias por regime; a gestora edita à vontade.
     - "Liberado" (AB) = dia abonado: não conta como hora devida.
     - Integra com o Ponto: gráfico de meta do mês + saldo (batido − escalado).
     Stack: HTML único + React 18 + Supabase + SheetJS. Sem build. GitHub Pages.
     ========================================================================== -->
<script>
  const SUPABASE_URL = "https://lnzvkfbcpnfmfvbdafab.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuenZrZmJjcG5mbWZ2YmRhZmFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODg2OTgsImV4cCI6MjA5NTA2NDY5OH0.EE1PF8moQPawVpsrM87iKa8IrD2yJ6tYKb0zAl17tbg";
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{ --ink:#12212B; --surface:#F5F7F8; --card:#FFFFFF; --line:#E1E7EA; --muted:#5C6B75;
    --primary:#0E7C7B; --primary-ink:#0A5A59; --ok:#2E7D5B; --ok-bg:#E7F4EE; --warn:#B26B00; --warn-bg:#FAEED4;
    --bad:#C0392B; --bad-bg:#FBE5E2; --blue:#1F6FB2; --radius:12px; --shadow:0 1px 2px rgba(18,33,43,.06),0 8px 24px rgba(18,33,43,.05); }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--surface);font-size:14px;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1400px;margin:0 auto;padding:22px 18px 80px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .brand h1{font-family:"Space Grotesk";font-weight:700;font-size:24px;margin:0}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .mode{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
  .mode.demo{background:var(--warn-bg);color:var(--warn)} .mode.live{background:var(--ok-bg);color:var(--ok)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .panel h2{font-family:"Space Grotesk";font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .field input,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font:inherit}
  .field input{width:80px}
  .btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--primary);color:var(--primary-ink)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff} .btn.primary:hover{background:var(--primary-ink);color:#fff}
  .btn.sm{padding:6px 10px;font-size:13px}
  .navbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
  .mlabel{font-family:"Space Grotesk";font-size:17px;min-width:150px;text-align:center}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chipx{display:inline-flex;align-items:center;gap:4px;background:var(--bad-bg);color:var(--bad);border-radius:20px;padding:3px 4px 3px 10px;font-size:12px;font-weight:600}
  .chipx button{border:none;background:none;color:var(--bad);cursor:pointer;font-size:15px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}

  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
  table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
  .grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
  .grid thead th{position:sticky;top:0;background:#F1F6F6;z-index:2;font-weight:600;color:var(--muted);padding:3px 3px}
  .grid th.wk,.grid td.wk{background:#F8FAFA}
  .grid th.hol,.grid td.hol{background:var(--bad-bg)}
  .grid th.dnum{font-family:"JetBrains Mono";font-size:12px;color:var(--ink);min-width:30px}
  .grid th.dwd{font-size:9px;text-transform:uppercase;font-weight:700}
  .namecol{position:sticky;left:0;background:#fff;z-index:1;text-align:left!important;padding:5px 10px!important;min-width:180px;border-right:2px solid var(--line)!important}
  thead .namecol{z-index:3;background:#F1F6F6}
  .nm{font-weight:600;font-size:12px} .nmsub{font-size:10px;color:var(--muted);margin-top:1px}
  .cell{border:none;background:transparent;width:100%;height:34px;text-align:center;font-family:"JetBrains Mono";font-weight:700;font-size:11px;cursor:pointer;appearance:none}
  .cell:focus{outline:2px solid var(--primary);outline-offset:-2px}
  .c-I{background:#E0F2FE;color:#0369A1} .c-M{background:#FEF3C7;color:#B45309} .c-T{background:#FFE4E8;color:#BE123C}
  .c-S{background:#E0E7FF;color:#3730A3} .c-F{background:#EEF2F5;color:#64748B} .c-AB{background:#DCFCE7;color:#15803D}
  .c-FE{background:#CCFBF1;color:#0F766E} .c-LC{background:#EDE9FE;color:#7C3AED}
  .totcol{position:sticky;right:0;background:#fff;z-index:1;border-left:2px solid var(--line)!important;min-width:96px;font-family:"JetBrains Mono";font-weight:700}
  thead .totcol{z-index:3;background:#F1F6F6}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .lg{width:26px;height:16px;border-radius:4px;font-family:"JetBrains Mono";font-weight:700;font-size:9px;display:inline-flex;align-items:center;justify-content:center}

  .bars{display:flex;flex-direction:column;gap:9px}
  .barrow{display:grid;grid-template-columns:220px 1fr 150px;gap:12px;align-items:center}
  .bname{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .track{position:relative;height:22px;background:#EEF2F3;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px}
  .tgt{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
  .binfo{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:12px}
  .pill{font-family:"JetBrains Mono";font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;min-width:52px;text-align:center}
  .p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
  /* saldo (2 lados) */
  .track2{position:relative;height:22px;background:#EEF2F3;border-radius:6px;border:1px solid var(--line);overflow:hidden}
  .zero{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--muted)}
  .pos{position:absolute;top:0;bottom:0;left:50%;background:var(--ok);border-radius:0 5px 5px 0}
  .neg{position:absolute;top:0;bottom:0;background:var(--bad);border-radius:5px 0 0 5px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  @media(max-width:720px){ .barrow{grid-template-columns:130px 1fr 120px} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const WD=["D","S","T","Q","Q","S","S"];
const REGIMES={int5:"Integral seg–sex",int6:"Integral + sábado",manha:"Só manhã",tarde:"Só tarde",custom:"Personalizado"};
const OPTS=[["","·"],["I","I"],["M","M"],["T","T"],["S","S"],["F","F"],["AB","AB"],["FE","FE"],["LC","LC"]];
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const wd=(y,m,d)=>new Date(y,m,d).getDay();

let _t=null;
function persist(s){ if(sb){ clearTimeout(_t); _t=setTimeout(()=>sb.from("escala_estado").upsert({id:1,dados:s,atualizado_em:new Date().toISOString()}).then(()=>{}),800); } }

function demoColabs(){ return [
  {id:"1",nome:"Paula Ribeiro",funcao:"Enfermeira",carga_horaria:44,regime:"int6"},
  {id:"2",nome:"Bianca Souza",funcao:"Recepcionista",carga_horaria:44,regime:"int5"},
  {id:"3",nome:"Carla Nunes",funcao:"Téc. laboratório",carga_horaria:40,regime:"int5"},
  {id:"4",nome:"Rui Alves",funcao:"Administrativo",carga_horaria:30,regime:"manha"},
]; }
function demoPonto(y,m){ const r=[]; const mk=(d,h,mi)=>new Date(y,m,d,h,mi).toISOString();
  for(let d=1;d<=20;d++){ const w=wd(y,m,d); if(w===0) continue;
    ["1","2","3"].forEach(id=>{ r.push({colaborador_id:id,tipo:"entrada",momento:mk(d,7,5)}); r.push({colaborador_id:id,tipo:"saida",momento:mk(d,(id==="3"?16:17),0)}); });
  } return r; }

function App(){
  const now=new Date();
  const [colabs,setColabs]=useState([]);
  const [ponto,setPonto]=useState([]);
  const [loading,setLoading]=useState(true);
  const [mes,setMes]=useState(now.getMonth()); const [ano,setAno]=useState(now.getFullYear());
  const [feriados,setFeriados]=useState([]); const [holIn,setHolIn]=useState("");
  const [horas,setHoras]=useState({I:8,M:4,T:4,S:5});
  const [sched,setSched]=useState({});
  const [lvId,setLvId]=useState(""); const [lvTipo,setLvTipo]=useState("FE"); const [lvA,setLvA]=useState(1); const [lvB,setLvB]=useState(1);

  const D=dim(ano,mes);
  const holKey=ano+"-"+mes;
  const hol=feriados.filter(f=>f.k===holKey).map(f=>f.d);

  async function load(){
    setLoading(true);
    if(sb){
      const [c,e]=await Promise.all([
        sb.from("colaboradores").select("id,nome,funcao,carga_horaria,regime").eq("ativo",true).order("nome"),
        sb.from("escala_estado").select("dados").eq("id",1).maybeSingle(),
      ]);
      setColabs(c.data||[]);
      const s=e.data&&e.data.dados;
      if(s&&Object.keys(s).length){ if(s.mes!=null)setMes(s.mes); if(s.ano!=null)setAno(s.ano);
        setFeriados(s.feriados||[]); setHoras(s.horas||{I:8,M:4,T:4,S:5}); setSched(s.sched||{}); }
    } else { setColabs(demoColabs()); setSched({}); }
    setLoading(false);
  }
  useEffect(()=>{ load(); },[]);

  // ponto do mês selecionado
  useEffect(()=>{ (async()=>{
    if(sb){
      const ini=new Date(ano,mes,1).toISOString(), fim=new Date(ano,mes+1,1).toISOString();
      const { data }=await sb.from("registros_ponto").select("colaborador_id,tipo,momento").gte("momento",ini).lt("momento",fim);
      setPonto(data||[]);
    } else setPonto(demoPonto(ano,mes));
  })(); },[ano,mes,loading]);

  useEffect(()=>{ if(!loading) persist({mes,ano,feriados,horas,sched}); },[mes,ano,feriados,horas,sched,loading]);

  const H=(code)=> code==="I"?horas.I: code==="M"?horas.M: code==="T"?horas.T: code==="S"?horas.S: 0;
  const metaMes=(c)=> Math.round((Number(c.carga_horaria)||0)*(D/7));
  const escalado=(c)=>{ const r=sched[c.id]||{}; let h=0; for(const d in r) h+=H(r[d]); return h; };

  const pontoBy=useMemo(()=>{ const m={}; ponto.forEach(r=>{ (m[r.colaborador_id]=m[r.colaborador_id]||[]).push(r); }); return m; },[ponto]);
  const batido=(id)=>{ const regs=pontoBy[id]||[]; const byDay={};
    regs.forEach(r=>{ const d=r.momento.slice(0,10); (byDay[d]=byDay[d]||[]).push(r); });
    let tot=0; Object.values(byDay).forEach(list=>{ list.sort((a,b)=>a.momento.localeCompare(b.momento)); let open=null;
      list.forEach(r=>{ if(r.tipo==="entrada") open=new Date(r.momento); else if(r.tipo==="saida"&&open){ tot+=(new Date(r.momento)-open)/36e5; open=null; } }); });
    return tot; };

  function setCell(id,d,code){ setSched(p=>{ const r={...(p[id]||{})}; if(code)r[d]=code; else delete r[d]; return {...p,[id]:r}; }); }
  function mudarMes(k){ let m=mes+k,y=ano; if(m<0){m=11;y--;} if(m>11){m=0;y++;} setMes(m); setAno(y); }
  function addHol(){ const d=+holIn; if(!d||d<1||d>D||hol.includes(d)) return; setFeriados(p=>[...p,{k:holKey,d}]); setHolIn(""); }
  function rmHol(d){ setFeriados(p=>p.filter(f=>!(f.k===holKey&&f.d===d))); }
  function aplicarAfast(){ if(!lvId) return; const a=Math.min(lvA,lvB),b=Math.max(lvA,lvB);
    setSched(p=>{ const r={...(p[lvId]||{})}; for(let d=a;d<=b;d++)r[d]=lvTipo; return {...p,[lvId]:r}; }); }

  function gerar(){
    const next={};
    colabs.forEach(c=>{ const cur=sched[c.id]||{}; const r=c.regime||"int5"; const row={};
      for(let d=1;d<=D;d++){ const pre=cur[d];
        if(pre==="FE"||pre==="LC"||pre==="F"||pre==="AB"){ row[d]=pre; continue; }
        if(hol.includes(d)){ row[d]="F"; continue; }
        const w=wd(ano,mes,d);
        if(r==="custom"){ if(pre)row[d]=pre; continue; }
        let code="F";
        if(r==="int5") code=(w>=1&&w<=5)?"I":"F";
        else if(r==="int6") code=(w>=1&&w<=5)?"I":(w===6?"S":"F");
        else if(r==="manha") code=(w>=1&&w<=6)?"M":"F";
        else if(r==="tarde") code=(w>=1&&w<=5)?"T":"F";
        row[d]=code;
      }
      next[c.id]=row;
    });
    setSched(next);
  }
  function limpar(){ setSched(p=>{ const n={}; for(const id in p){ n[id]={}; for(const d in p[id]){ const v=p[id][d]; if(v==="FE"||v==="LC"||v==="AB")n[id][d]=v; } } return n; }); }

  const maxMeta=Math.max(1,...colabs.map(c=>Math.max(metaMes(c),escalado(c))));
  const maxSaldo=Math.max(1,...colabs.map(c=>Math.abs(batido(c.id)-escalado(c))));

  function pill(v){ const a=Math.abs(v); const cls=a<8?"p-ok":a<16?"p-warn":"p-bad"; return <span className={"pill "+cls}>{v>0?"+":""}{v.toFixed(0)}h</span>; }

  function exportar(){
    const wb=XLSX.utils.book_new(); const head=["Funcionário","Função","Regime","Carga/sem"];
    for(let d=1;d<=D;d++) head.push(d+WD[wd(ano,mes,d)]);
    head.push("Escalado","Meta","Batido","Saldo");
    const aoa=[["Escala — "+MESES[mes]+"/"+ano],[],head];
    colabs.forEach(c=>{ const r=sched[c.id]||{}; const row=[c.nome,c.funcao||"",REGIMES[c.regime]||"",c.carga_horaria||""];
      for(let d=1;d<=D;d++)row.push(r[d]||""); const e=escalado(c),b=batido(c.id); row.push(e,metaMes(c),b.toFixed(1),(b-e).toFixed(1)); aoa.push(row); });
    const ws=XLSX.utils.aoa_to_sheet(aoa); XLSX.utils.book_append_sheet(wb,ws,"Escala");
    XLSX.writeFile(wb,"escala-"+MESES[mes].toLowerCase()+"-"+ano+".xlsx");
  }

  const days=Array.from({length:D},(_,i)=>i+1);

  return (
    <div className="wrap">
      <div className="top">
        <div className="brand"><h1>Escala</h1><p>Grade de trabalho de toda a equipe · integrada ao ponto</p></div>
        <span className={"mode "+(sb?"live":"demo")}>{sb?"● Conectado":"○ Modo demo"}</span>
      </div>

      <div className="panel">
        <h2>Mês · horas dos turnos · feriados</h2>
        <div className="row">
          <button className="navbtn" onClick={()=>mudarMes(-1)}>‹</button>
          <div className="mlabel">{MESES[mes]} {ano}</div>
          <button className="navbtn" onClick={()=>mudarMes(1)}>›</button>
          <div className="field"><label>Integral (h)</label><input type="number" value={horas.I} onChange={e=>setHoras({...horas,I:+e.target.value||0})}/></div>
          <div className="field"><label>Manhã (h)</label><input type="number" value={horas.M} onChange={e=>setHoras({...horas,M:+e.target.value||0})}/></div>
          <div className="field"><label>Tarde (h)</label><input type="number" value={horas.T} onChange={e=>setHoras({...horas,T:+e.target.value||0})}/></div>
          <div className="field"><label>Sábado (h)</label><input type="number" value={horas.S} onChange={e=>setHoras({...horas,S:+e.target.value||0})}/></div>
          <div className="field"><label>Feriado (dia)</label>
            <div style={{display:"flex",gap:6}}><input type="number" value={holIn} onChange={e=>setHolIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addHol()} style={{width:70}}/><button className="btn sm" onClick={addHol}>+</button></div></div>
          <div style={{flex:1}}></div>
          <button className="btn" onClick={exportar}>Excel</button>
          <button className="btn" onClick={()=>window.print()}>Imprimir</button>
          <button className="btn primary" onClick={gerar}>⚡ Gerar grade</button>
        </div>
        {hol.length>0 && <div className="chips">{hol.map(d=><span className="chipx" key={d}>{d}/{mes+1}<button onClick={()=>rmHol(d)}>×</button></span>)}</div>}
        <div className="hint">Clínica: seg–sex 07–18, sábado 07–12. A grade é gerada pelo regime de cada um (definido no RH) e você edita à vontade. <b>AB (Liberado)</b> = dia abonado, não conta como hora devida.</div>
      </div>

      <div className="panel">
        <h2>Afastamentos e liberações</h2>
        <div className="row">
          <div className="field"><label>Pessoa</label><select value={lvId} onChange={e=>setLvId(e.target.value)} style={{minWidth:170}}><option value="">— selecione —</option>{colabs.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</select></div>
          <div className="field"><label>Tipo</label><select value={lvTipo} onChange={e=>setLvTipo(e.target.value)}><option value="FE">Férias</option><option value="LC">Licença</option><option value="AB">Liberado (abono)</option><option value="F">Folga</option></select></div>
          <div className="field"><label>Do dia</label><input type="number" min="1" max={D} value={lvA} onChange={e=>setLvA(+e.target.value||1)}/></div>
          <div className="field"><label>Até</label><input type="number" min="1" max={D} value={lvB} onChange={e=>setLvB(+e.target.value||1)}/></div>
          <button className="btn primary" onClick={aplicarAfast}>Aplicar</button>
          <div style={{flex:1}}></div>
          <button className="btn sm" onClick={limpar}>Limpar grade</button>
        </div>
        <div className="hint">Férias/licença/liberação são preservadas ao clicar em "Gerar grade".</div>
      </div>

      {loading ? <div className="panel"><div className="empty">Carregando…</div></div> :
       colabs.length===0 ? <div className="panel"><div className="empty">Nenhum colaborador ativo. Cadastre no RH (com função, carga horária e regime).</div></div> :
      <>
        <div className="scroll">
          <table className="grid">
            <thead><tr>
              <th className="namecol">Funcionário</th>
              {days.map(d=>{ const h=hol.includes(d), w=wd(ano,mes,d), we=w===0||w===6;
                return <th key={d} className={h?"hol":we?"wk":""}><div className="dwd">{WD[w]}</div><div className="dnum">{d}</div></th>; })}
              <th className="totcol">Escala / Meta</th>
            </tr></thead>
            <tbody>
              {colabs.map(c=>{ const r=sched[c.id]||{}; const e=escalado(c),mt=metaMes(c);
                return <tr key={c.id}>
                  <td className="namecol"><div className="nm">{c.nome}</div><div className="nmsub">{c.funcao||"—"} · {c.carga_horaria||"?"}h/sem · {REGIMES[c.regime]||"—"}</div></td>
                  {days.map(d=>{ const code=r[d]||""; const h=hol.includes(d), w=wd(ano,mes,d), we=w===0||w===6;
                    return <td key={d} className={h?"hol":we?"wk":""}>
                      <select className={"cell "+(code?"c-"+code:"")} value={code} onChange={ev=>setCell(c.id,d,ev.target.value)}>
                        {OPTS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></td>; })}
                  <td className="totcol"><div style={{padding:"0 8px"}}>{e}h <span style={{color:"var(--muted)",fontWeight:400}}>/ {mt}h</span></div></td>
                </tr>; })}
            </tbody>
          </table>
        </div>
        <div className="legend">
          <span><i className="lg c-I">I</i>Integral</span><span><i className="lg c-M">M</i>Manhã</span><span><i className="lg c-T">T</i>Tarde</span>
          <span><i className="lg c-S">S</i>Sábado</span><span><i className="lg c-F">F</i>Folga</span><span><i className="lg c-AB">AB</i>Liberado</span>
          <span><i className="lg c-FE">FE</i>Férias</span><span><i className="lg c-LC">LC</i>Licença</span>
        </div>

        <div className="panel" style={{marginTop:16}}>
          <h2>Meta do mês — horas escaladas × carga contratada</h2>
          <div className="bars">
            {colabs.map(c=>{ const e=escalado(c),mt=metaMes(c),dif=e-mt;
              const cls=Math.abs(dif)<8?"var(--ok)":Math.abs(dif)<16?"var(--warn)":"var(--bad)";
              return <div className="barrow" key={c.id}>
                <div className="bname">{c.nome} <span style={{color:"var(--muted)",fontWeight:400,fontSize:11}}>· meta {mt}h</span></div>
                <div className="track"><div className="fill" style={{width:Math.min(100,e/maxMeta*100)+"%",background:cls}}></div><div className="tgt" style={{left:(mt/maxMeta*100)+"%"}}></div></div>
                <div className="binfo"><span className="mono">{e}h</span>{pill(dif)}</div>
              </div>; })}
          </div>
          <div className="hint">Barra = horas que você escalou. Linha preta = carga contratada do mês. Verde: dentro de ±8h.</div>
        </div>

        <div className="panel">
          <h2>Saldo do ponto — batido × escalado (crédito / devendo)</h2>
          <div className="bars">
            {colabs.map(c=>{ const e=escalado(c),b=batido(c.id),saldo=b-e;
              const w=Math.min(50,Math.abs(saldo)/maxSaldo*50);
              return <div className="barrow" key={c.id}>
                <div className="bname">{c.nome} <span style={{color:"var(--muted)",fontWeight:400,fontSize:11}}>· batido {b.toFixed(0)}h / escala {e}h</span></div>
                <div className="track2"><div className="zero"></div>
                  {saldo>=0 ? <div className="pos" style={{width:w+"%"}}></div> : <div className="neg" style={{width:w+"%",left:(50-w)+"%"}}></div>}</div>
                <div className="binfo">{pill(saldo)}</div>
              </div>; })}
          </div>
          <div className="hint">Positivo (verde) = trabalhou mais que o escalado (crédito). Negativo (vermelho) = está devendo. Dias liberados (AB) não entram como dívida.</div>
        </div>
      </>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
