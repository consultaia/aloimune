  :root{ --ink:#12212B; --surface:#F5F7F8; --card:#FFFFFF; --line:#E1E7EA; --muted:#5C6B75;
    --primary:#0E7C7B; --primary-ink:#0A5A59; --ok:#2E7D5B; --ok-bg:#E7F4EE; --warn:#B26B00; --warn-bg:#FAEED4; --bad:#C0392B; --bad-bg:#FBE5E2;

  .prow:hover{background:#FAFBFB} .prow.sel{background:#F3F8F7;border-left-color:var(--primary)}

  .camwrap.ok{border-color:var(--ok)}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}

  .consent input{margin-top:2px}

  .btn-primary{background:var(--primary);color:#fff} .btn-primary:disabled{opacity:.5}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  table{width:100%;border-collapse:collapse}

  td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}

  .modal h2{font-family:"Space Grotesk";margin:0 0 16px;font-size:19px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field.full{grid-column:1/-1}

  .mono{font-variant-numeric:tabular-nums}

<div id="root"></div>
<script type="text/babel">
const _dl=(d)=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);};

const { useState, useEffect, useRef } = React;
const DEMO_URL = /[?&]demo=1/.test(location.search); // ?demo=1 => modo demonstração (dados fictícios, nada salvo)
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY&&!DEMO_URL)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const fmtDia=(iso)=>{const d=new Date(iso);return d.toLocaleDateString("pt-BR");};
const fmtH=(iso)=>new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

/* ===== ALMOÇO / INTERVALO =====
   As batidas continuam sendo só "entrada" e "saída"; o almoço é reconhecido pela ordem do dia:
   Entrada → Saída para almoço → Volta do almoço → Saída. Se houver mais de uma pausa, o almoço é a maior.
   Regra da clínica: jornada acima de 6h precisa de pelo menos 1h de intervalo (CLT art. 71: máx. 2h). */
const ALMOCO_MIN=60, ALMOCO_MAX=120, JORNADA_COM_ALMOCO=6;
const fmtMin=(m)=>{ m=Math.round(m); const h=Math.floor(m/60), r=m%60; return h ? (h+"h"+(r?String(r).padStart(2,"0"):"")) : (r+"min"); };
function analisarDia(itens){
  const its=[...itens].sort((a,b)=>a.momento.localeCompare(b.momento));
  const rot=its.map(r=> r.tipo==="entrada" ? "Entrada" : "Saída");
  let total=0, open=null, ok=true;
  its.forEach(r=>{ if(r.tipo==="entrada"){ if(open) ok=false; open=new Date(r.momento); } else { if(!open) ok=false; else { total+=(new Date(r.momento)-open)/36e5; open=null; } } });
  if(open) ok=false;
  // pausas = saída seguida de entrada
  const pausas=[];
  for(let i=0;i+1<its.length;i++) if(its[i].tipo==="saida" && its[i+1].tipo==="entrada")
    pausas.push({i, min:(new Date(its[i+1].momento)-new Date(its[i].momento))/6e4});
  const almoco = pausas.length ? pausas.reduce((a,b)=> b.min>a.min ? b : a) : null;
  if(almoco){ rot[almoco.i]="Saída almoço"; rot[almoco.i+1]="Volta almoço"; }
  const intervalo=pausas.reduce((s,p)=>s+p.min,0);
  // jornada = do primeiro ao último registro (para saber se o intervalo era obrigatório)
  const jornada = its.length>=2 ? (new Date(its[its.length-1].momento)-new Date(its[0].momento))/36e5 : 0;
  const alertas=[];
  if(!ok){
    if(its.length && its[its.length-1].tipo==="entrada") alertas.push({sev:"bad", t: almoco||its.length===1 ? "Falta a saída" : "Falta batida"});
    else alertas.push({sev:"bad", t:"Batidas fora de ordem / faltando"});
  }
  if(ok && total>JORNADA_COM_ALMOCO){
    if(!almoco) alertas.push({sev:"warn", t:`Sem batida de almoço (${total.toFixed(1).replace(".",",")}h direto)`});
    else if(almoco.min<ALMOCO_MIN) alertas.push({sev:"bad", t:`Almoço de ${fmtMin(almoco.min)} (mínimo 1h)`});
  }
  if(almoco && almoco.min>ALMOCO_MAX) alertas.push({sev:"warn", t:`Almoço de ${fmtMin(almoco.min)} (acima de 2h)`});
  const pega=(lbl)=>{ const i=rot.indexOf(lbl); return i<0?null:its[i]; };
  const flags={ faltando:!ok, semAlmoco: ok&&total>JORNADA_COM_ALMOCO&&!almoco, almocoCurto: ok&&total>JORNADA_COM_ALMOCO&&!!almoco&&almoco.min<ALMOCO_MIN, almocoLongo: !!almoco&&almoco.min>ALMOCO_MAX };
  return { its, rot, horas:total, ok, almoco, intervalo, jornada, alertas, flags,
           entrada: its[0]&&its[0].tipo==="entrada" ? its[0] : null,
           saidaAlmoco: pega("Saída almoço"), voltaAlmoco: pega("Volta almoço"),
           saida: its.length>1 && its[its.length-1].tipo==="saida" ? its[its.length-1] : null };
}
function Situacao({ a }){
  if(!a.alertas.length) return <span style={{color:"var(--ok)",fontWeight:600,fontSize:12.5}}>ok</span>;
  return <div style={{display:"flex",flexDirection:"column",gap:3}}>{a.alertas.map((x,i)=>
    <span key={i} style={{color:x.sev==="bad"?"var(--bad)":"var(--warn)",fontWeight:600,fontSize:12.5,whiteSpace:"nowrap"}}>⚠ {x.t}</span>)}</div>;
}

function Enroll(){
  const videoRef=useRef(null);
  const streamRef=useRef(null);
  const [colabs,setColabs]=useState([]); const [bio,setBio]=useState({});
  const [sel,setSel]=useState(null);
  const [modelo,setModelo]=useState("carregando"); // carregando | ok | erro
  const [cam,setCam]=useState("off");               // off | ligando | on | erro
  const [camInfo,setCamInfo]=useState("");
  const [desc,setDesc]=useState(null); const [pin,setPin]=useState(""); const [consent,setConsent]=useState(false);
  const [msg,setMsg]=useState(""); const [capturing,setCapturing]=useState(false);

  async function load(){
    if(sb){
      const [c,b]=await Promise.all([ sb.from("colaboradores").select("id,nome,funcao").eq("ativo",true).order("nome"), sb.from("ponto_biometria").select("colaborador_id,pin,consentimento_em,descritor") ]);
      setColabs(c.data||[]); const m={}; (b.data||[]).forEach(r=>m[r.colaborador_id]={pin:r.pin,tem_desc:Array.isArray(r.descritor)&&r.descritor.length>0,consent:r.consentimento_em}); setBio(m);
    } else {
      setColabs([{id:"1",nome:"Paula Ribeiro",funcao:"Enfermeira"},{id:"2",nome:"Bianca Souza",funcao:"Recepcionista"}]); setBio({});
    }
  }
  useEffect(()=>{ load(); },[]);

  // Carrega o modelo de reconhecimento uma vez (independente da câmera).
  useEffect(()=>{ (async()=>{
    try{
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      setModelo("ok");
    }catch(e){ setModelo("erro"); console.log("modelo:", String(e)); }
  })();
  return ()=>{ if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop()); };
  },[]);

  // A câmera é ligada por um CLIQUE (gesto do usuário nunca é bloqueado pelo navegador).
  async function ligarCamera(){
    setCam("ligando"); setCamInfo(""); setMsg("");
    try{
      if(streamRef.current){ streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current=null; }
      const stream=await navigator.mediaDevices.getUserMedia({ video:{ width:{ideal:640}, height:{ideal:480}, facingMode:"user" }, audio:false });
      streamRef.current=stream;
      const v=videoRef.current;
      v.srcObject=stream; v.muted=true; v.playsInline=true; v.setAttribute("playsinline","");
      try{ await v.play(); }catch(_){ }
      let n=0;
      const conferir=()=>{ n++;
        if(v.videoWidth>0){ setCam("on"); setCamInfo(v.videoWidth+"×"+v.videoHeight); }
        else if(n<25){ setTimeout(conferir,150); }
        else { setCam("erro"); setCamInfo("A câmera ligou mas não enviou imagem. Feche apps que usam a câmera (Zoom/Teams/Meet) ou tente outro navegador."); }
      };
      conferir();
    }catch(e){ setCam("erro"); setCamInfo((e.name?e.name+": ":"")+(e.message||String(e))); }
  }
  function desligarCamera(){ if(streamRef.current){ streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current=null; } if(videoRef.current) videoRef.current.srcObject=null; setCam("off"); }

  function escolher(c){ setSel(c); setDesc(null); setPin(""); setConsent(false); setMsg(""); }

  async function capturar(){
    if(cam!=="on"){ setMsg("Ligue a câmera primeiro."); return; }
    if(modelo!=="ok"){ setMsg("Reconhecimento indisponível — você pode salvar só com o PIN."); return; }
    const v=videoRef.current;
    if(!v || v.videoWidth===0){ setMsg("A câmera ainda não está enviando imagem."); return; }
    setCapturing(true); setMsg("Detectando rosto…");
    const opts=new faceapi.TinyFaceDetectorOptions({ inputSize:320, scoreThreshold:0.4 });
    const amostras=[];
    try{
      for(let i=0;i<12 && amostras.length<3;i++){
        const det=await faceapi.detectSingleFace(v,opts).withFaceLandmarks().withFaceDescriptor();
        if(det){ amostras.push(Array.from(det.descriptor)); setMsg("Capturando… "+amostras.length+"/3"); }
        if(amostras.length<3) await new Promise(r=>setTimeout(r,120));
      }
    }catch(e){ setCapturing(false); setMsg("Erro ao ler o rosto: "+(e.message||String(e))); return; }
    setCapturing(false);
    if(amostras.length<2){ setMsg("Não consegui ver o rosto. Aproxime o rosto, melhore a luz e tente de novo."); return; }
    const media=amostras[0].map((_,k)=> amostras.reduce((s,a)=>s+a[k],0)/amostras.length);
    setDesc(media); setMsg("Rosto capturado ✓");
  }

  async function salvar(){
    if(!sel){ setMsg("Selecione um funcionário."); return; }
    if(!consent){ setMsg("Marque o consentimento."); return; }
    if(!desc && !pin){ setMsg("Cadastre o rosto OU informe um PIN de reserva."); return; }
    const payload={ colaborador_id:sel.id, nome:sel.nome, descritor:desc, pin:pin||null, consentimento_em:new Date().toISOString() };
    if(sb){ const { error }=await sb.from("ponto_biometria").upsert(payload); if(error){ setMsg("Erro: "+error.message); return; } await load(); }
    else setBio(p=>({...p,[sel.id]:{colaborador_id:sel.id,pin}}));
    setMsg("Cadastro salvo para "+sel.nome+"."); setDesc(null); setConsent(false); setPin("");
  }

  const erroMsg = (t)=> t && (t.startsWith("Erro")||t.startsWith("Não")||t.startsWith("Ligue")||t.startsWith("A câmera")||t.startsWith("Marque")||t.startsWith("Selecione")||t.startsWith("Reconhecimento"));

  return (
    <div className="cols">
      <div className="card">
        <h3>Funcionários</h3>
        {colabs.map(c=>(
          <button key={c.id} className={"prow"+(sel?.id===c.id?" sel":"")} onClick={()=>escolher(c)}>
            <span><span className="pn" style={{display:"block"}}>{c.nome}</span><span style={{fontSize:12.5,color:"var(--muted)"}}>{c.funcao||"—"}</span></span>
            <span className={"tag "+(bio[c.id]?"sim":"nao")}>{bio[c.id]?"cadastrado":"pendente"}</span>
          </button>
        ))}
        {colabs.length===0 && <div className="empty">Cadastre funcionários no RH primeiro.</div>}
      </div>

      <div className="card"><div className="enroll">
        <div style={{fontSize:12.5,marginBottom:10,color:modelo==="erro"?"var(--bad)":"var(--muted)"}}>
          Reconhecimento facial: {modelo==="carregando"?"carregando…":modelo==="ok"?"pronto ✓":"indisponível — dá para cadastrar só com PIN"}
        </div>

        <div className="camwrap" style={{position:"relative"}}>
          <video ref={videoRef} autoPlay playsInline muted style={{width:"100%",height:"100%",objectFit:"cover",transform:"scaleX(-1)",display:cam==="on"?"block":"none"}}></video>
          {cam!=="on" &&
            <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,color:"#fff",textAlign:"center",padding:16}}>
              {cam==="ligando" ? <span>Ligando a câmera…</span> :
                <><span style={{fontSize:13,opacity:.85}}>{cam==="erro"?"Não consegui abrir a câmera":"Câmera desligada"}</span>
                  <button className="btn btn-primary" onClick={ligarCamera}>Ligar câmera</button></>}
            </div>}
        </div>
        {cam==="erro" && <div style={{fontSize:12.5,color:"var(--bad)",marginTop:6,lineHeight:1.4}}>{camInfo}</div>}
        {cam==="on" && <div style={{fontSize:12,color:"var(--muted)",marginTop:6,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>Câmera ativa · {camInfo} <button className="btn btn-ghost btn-sm" onClick={desligarCamera}>desligar</button></div>}

        {!sel ? <div className="empty" style={{padding:"18px 0"}}>Selecione um funcionário à esquerda para cadastrar.</div> : <>
          <div style={{fontWeight:600,fontSize:16,margin:"14px 0 6px"}}>{sel.nome}</div>
          {bio[sel.id] && <div style={{background:"var(--ok-bg)",border:"1px solid #CDE7DD",color:"var(--primary-ink)",borderRadius:10,padding:"9px 12px",fontSize:13,marginBottom:12,lineHeight:1.5}}>
            ✓ Já cadastrado · biometria: {bio[sel.id].tem_desc?"sim":"não (só PIN)"} · PIN: {bio[sel.id].pin?"definido":"não"}<br/>
            {bio[sel.id].consent ? "Autorização (LGPD) registrada em "+new Date(bio[sel.id].consent).toLocaleDateString("pt-BR")+" às "+new Date(bio[sel.id].consent).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "Sem data de autorização registrada."}<br/>
            <span style={{color:"var(--muted)"}}>Para trocar o rosto ou o PIN, capture de novo abaixo e salve — isto substitui o cadastro atual.</span>
          </div>}
          <div className="row" style={{marginBottom:14}}>
            <button className="btn btn-ghost" onClick={capturar} disabled={capturing||cam!=="on"}>{capturing?"Capturando…":(bio[sel.id]&&bio[sel.id].tem_desc?"Recadastrar rosto":"Capturar rosto")}</button>
            {desc && <span className="cap-ok">✓ rosto capturado</span>}
          </div>
          <div className="field"><label>PIN de reserva (4 a 6 dígitos)</label>
            <input value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,"").slice(0,6))} placeholder="ex.: 1234" /></div>
          <label className="consent"><input type="checkbox" checked={consent} onChange={e=>setConsent(e.target.checked)} />
            <span>O funcionário autoriza o uso da sua biometria facial exclusivamente para o registro de ponto, conforme a LGPD. Guardamos apenas o descritor (números), nunca a foto.</span></label>
          <div className="row">
            <button className="btn btn-primary" onClick={salvar} disabled={!consent||(!desc&&!pin)}>Salvar cadastro</button>
            {msg && <span style={{fontSize:13.5,color:erroMsg(msg)?"var(--bad)":"var(--ok)"}}>{msg}</span>}
          </div>
        </>}
      </div></div>
    </div>
  );
}


function Relatorio(){
  const [regs,setRegs]=useState([]); const [nomes,setNomes]=useState({}); const [loading,setLoading]=useState(true);
  useEffect(()=>{ (async()=>{
    if(sb){
      const desde=new Date(Date.now()-30*864e5).toISOString();
      const [r,c]=await Promise.all([ sb.from("registros_ponto").select("*").gte("momento",desde).order("momento",{ascending:true}), sb.from("colaboradores").select("id,nome") ]);
      setRegs(r.data||[]); const m={}; (c.data||[]).forEach(x=>m[x.id]=x.nome); setNomes(m);
    } else {
      const t=(h)=>new Date(Date.now()-h*36e5).toISOString();
      setRegs([
        {colaborador_id:"1",tipo:"entrada",metodo:"facial",momento:t(9)},
        {colaborador_id:"1",tipo:"saida",metodo:"facial",momento:t(5)},
        {colaborador_id:"1",tipo:"entrada",metodo:"facial",momento:t(4)},
        {colaborador_id:"1",tipo:"saida",metodo:"facial",momento:t(1)},
        {colaborador_id:"2",tipo:"entrada",metodo:"pin",momento:t(8)},
        {colaborador_id:"2",tipo:"saida",metodo:"facial",momento:t(2)},
      ]);
      setNomes({"1":"Paula Ribeiro","2":"Bianca Souza"});
    }
    setLoading(false);
  })(); },[]);

  // agrupa por colaborador + dia
  const grupos={};
  regs.forEach(r=>{ const dia=_dl(r.momento); const k=r.colaborador_id+"|"+dia;
    (grupos[k]=grupos[k]||{colab:r.colaborador_id,dia,itens:[]}).itens.push(r); });
  const linhas=Object.values(grupos).map(g=>({...g, ...analisarDia(g.itens)}))
    .sort((a,b)=> (nomes[a.colab]||"").localeCompare(nomes[b.colab]||"") || a.dia.localeCompare(b.dia));

  if(loading) return <div className="empty">Carregando…</div>;
  if(linhas.length===0) return <div className="card"><div className="empty">Nenhum registro nos últimos 30 dias.</div></div>;

  return (
    <div className="card">
      <table>
        <thead><tr><th>Funcionário</th><th>Dia</th><th>Marcações</th><th>Almoço</th><th>Horas</th><th>Situação</th></tr></thead>
        <tbody>
          {linhas.map((l,i)=>(
            <tr key={i}>
              <td style={{fontWeight:600}}>{nomes[l.colab]||"—"}</td>
              <td className="mono">{l.dia.split("-").reverse().join("/")}</td>
              <td className="mono">{l.its.map((r,j)=>`${l.rot[j]} ${fmtH(r.momento)}`).join("  ·  ")}</td>
              <td className="mono">{l.almoco ? fmtMin(l.almoco.min) : "—"}</td>
              <td className="tot mono">{l.horas.toFixed(1)}h</td>
              <td><Situacao a={l} /></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}


/* ===== ESPELHO / TRATAMENTO DE PONTO ===== */
const MESES_P=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function Espelho(){
  const now=new Date();
  const [ano,setAno]=useState(now.getFullYear()); const [mes,setMes]=useState(now.getMonth());
  const [colabs,setColabs]=useState([]); const [selC,setSelC]=useState("");
  const [regs,setRegs]=useState([]); const [loading,setLoading]=useState(true); const [edit,setEdit]=useState(null);

  async function load(){
    setLoading(true);
    if(sb){
      const ini=new Date(ano,mes,1).toISOString(), fim=new Date(ano,mes+1,1).toISOString();
      const [r,c]=await Promise.all([
        sb.from("registros_ponto").select("*").gte("momento",ini).lt("momento",fim).order("momento",{ascending:true}),
        sb.from("colaboradores").select("id,nome").eq("ativo",true).order("nome"),
      ]);
      if(r.error) alert(r.error.message);
      setRegs(r.data||[]); setColabs(c.data||[]);
    } else {
      const t=(d,h,mi)=>new Date(now.getFullYear(),now.getMonth(),d,h,mi).toISOString();
      setColabs([{id:"1",nome:"Paula Ribeiro"},{id:"2",nome:"Bianca Souza"},{id:"3",nome:"Carla Nunes"}]);
      setRegs([ {id:"a",colaborador_id:"1",tipo:"entrada",metodo:"facial",momento:t(2,7,58)},
                {id:"a2",colaborador_id:"1",tipo:"saida",metodo:"facial",momento:t(2,12,1)},
                {id:"a3",colaborador_id:"1",tipo:"entrada",metodo:"facial",momento:t(2,13,4)},
                {id:"b",colaborador_id:"1",tipo:"saida",metodo:"facial",momento:t(2,17,3)},
                {id:"d1",colaborador_id:"2",tipo:"entrada",metodo:"pin",momento:t(2,8,0)},
                {id:"d2",colaborador_id:"2",tipo:"saida",metodo:"pin",momento:t(2,12,0)},
                {id:"d3",colaborador_id:"2",tipo:"entrada",metodo:"pin",momento:t(2,12,35)},
                {id:"d4",colaborador_id:"2",tipo:"saida",metodo:"pin",momento:t(2,17,0)},
                {id:"e1",colaborador_id:"3",tipo:"entrada",metodo:"facial",momento:t(2,8,0)},
                {id:"e2",colaborador_id:"3",tipo:"saida",metodo:"facial",momento:t(2,17,0)},
                {id:"c",colaborador_id:"2",tipo:"entrada",metodo:"pin",momento:t(3,8,10)},
                {id:"c2",colaborador_id:"2",tipo:"saida",metodo:"pin",momento:t(3,12,10)},
                {id:"c3",colaborador_id:"2",tipo:"entrada",metodo:"pin",momento:t(3,13,10)} ]);
    }
    setLoading(false);
  }
  useEffect(()=>{ load(); },[ano,mes]);
  function mudarMes(k){ let m=mes+k,y=ano; if(m<0){m=11;y--;} if(m>11){m=0;y++;} setMes(m); setAno(y); }

  const nomes=Object.fromEntries(colabs.map(c=>[c.id,c.nome]));
  const filtr=regs.filter(r=> !selC || r.colaborador_id===selC);
  const grupos={};
  filtr.forEach(r=>{ const dia=_dl(r.momento); const k=r.colaborador_id+"|"+dia;   // dia no fuso local (não UTC)
    (grupos[k]=grupos[k]||{colab:r.colaborador_id,dia,itens:[]}).itens.push(r); });
  const linhas=Object.values(grupos).map(g=>({...g, ...analisarDia(g.itens)})).sort((a,b)=> (nomes[a.colab]||"").localeCompare(nomes[b.colab]||"") || b.dia.localeCompare(a.dia));

  async function salvar(f){
    if(!f.colaborador_id||!f.data||!f.hora) return "Preencha funcionário, data e hora.";
    const momento=new Date(f.data+"T"+(f.hora.length===5?f.hora:f.hora+":00")).toISOString();
    if(sb){ const payload={colaborador_id:f.colaborador_id,tipo:f.tipo,momento,metodo:f.id?"ajuste":"ajuste"};
      const r=f.id? await sb.from("registros_ponto").update(payload).eq("id",f.id) : await sb.from("registros_ponto").insert(payload);
      if(r.error) return r.error.message; await load(); }
    else setRegs(p=> f.id? p.map(x=>x.id===f.id?{...x,tipo:f.tipo,momento}:x):[...p,{id:"n"+Date.now(),colaborador_id:f.colaborador_id,tipo:f.tipo,metodo:"ajuste",momento}]);
    setEdit(null); return null;
  }
  async function excluir(r){ if(!confirm("Excluir esta batida?")) return;
    if(sb){ const e=await sb.from("registros_ponto").delete().eq("id",r.id); if(e.error) return alert(e.error.message); await load(); }
    else setRegs(p=>p.filter(x=>x.id!==r.id)); }

  const fmtH=(iso)=>new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const fmtD=(iso)=>{ const [y,m,d]=iso.slice(0,10).split("-"); return d+"/"+m; };
  // data e hora no fuso local (antes usava o horário UTC do banco: aparecia 3h adiantado)
  const abrirEdit=(r)=> setEdit({ id:r.id, colaborador_id:r.colaborador_id, tipo:r.tipo, data:_dl(r.momento), hora:fmtH(r.momento) });
  const comAlerta=linhas.filter(l=>l.alertas.length).length;
  // Excel formatado: aba "Espelho" (dia a dia, com total por pessoa) e aba "Resumo"
  function exportar(){
    const X=window.XLSX;
    if(!X){ alert("Não consegui carregar o gerador de Excel. Confira a internet e tente de novo."); return; }
    const linha={style:"thin",color:{rgb:"D5DDE0"}}; const borda={top:linha,bottom:linha,left:linha,right:linha};
    const base={border:borda,alignment:{vertical:"center"},font:{name:"Calibri",sz:11}};
    const S={
      titulo:{font:{name:"Calibri",bold:true,sz:15,color:{rgb:"0A5E5D"}}},
      sub:{font:{name:"Calibri",sz:10,italic:true,color:{rgb:"5C6B75"}}},
      cab:{...base,font:{name:"Calibri",bold:true,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"0E7C7B"}},alignment:{horizontal:"center",vertical:"center",wrapText:true}},
      txt:base, nome:{...base,font:{name:"Calibri",bold:true}},
      cen:{...base,alignment:{horizontal:"center",vertical:"center"}},
      alm:{...base,alignment:{horizontal:"center",vertical:"center"},fill:{fgColor:{rgb:"E6EFF9"}}},
      ok:{...base,font:{name:"Calibri",bold:true,color:{rgb:"2E7D5B"}},fill:{fgColor:{rgb:"E7F4EE"}}},
      warn:{...base,font:{name:"Calibri",bold:true,color:{rgb:"8A5300"}},fill:{fgColor:{rgb:"FAEED4"}},alignment:{vertical:"center",wrapText:true}},
      bad:{...base,font:{name:"Calibri",bold:true,color:{rgb:"C0392B"}},fill:{fgColor:{rgb:"FBE5E2"}},alignment:{vertical:"center",wrapText:true}},
      tot:{...base,font:{name:"Calibri",bold:true},fill:{fgColor:{rgb:"EEF2F3"}}},
      totc:{...base,font:{name:"Calibri",bold:true},fill:{fgColor:{rgb:"EEF2F3"}},alignment:{horizontal:"center",vertical:"center"}},
      mini:{...base,font:{name:"Calibri",sz:9,color:{rgb:"5C6B75"}}},
    };
    // valores de data/hora do Excel (dá para somar e filtrar)
    const serial=(iso)=>{ const [y,m,d]=iso.split("-").map(Number); return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5; };
    const hm=(r)=>{ if(!r) return null; const d=new Date(r.momento); return (d.getHours()*60+d.getMinutes())/1440; };
    // cada célula com sua própria cópia do estilo (a biblioteca grava o formato dentro do objeto de estilo)
    const cel=(v,s,z)=>{ const fmt=z||"General"; const st={...s,numFmt:fmt};
      return v==null||v==="" ? {v:"",t:"s",s:st} : {v, t:typeof v==="number"?"n":"s", z:fmt, s:st}; };
    const DS=["dom","seg","ter","qua","qui","sex","sáb"];
    function aba(rows, larguras, merges, alturas){
      const ws={}; let maxC=0;
      rows.forEach((r,ri)=>r.forEach((c,ci)=>{ if(!c) return; ws[X.utils.encode_cell({r:ri,c:ci})]=c; maxC=Math.max(maxC,ci); }));
      ws["!ref"]=X.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:maxC}});
      ws["!cols"]=larguras.map(w=>({wch:w})); ws["!merges"]=merges||[]; ws["!rows"]=alturas||[];
      return ws;
    }
    const periodo=MESES_P[mes]+" "+ano, quem=selC ? (nomes[selC]||"") : "Toda a equipe";
    const gerado="Gerado em "+new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+" · "+quem+" · almoço mínimo de 1h para jornada acima de 6h";
    const porPessoa={}; linhas.forEach(l=>{ (porPessoa[l.colab]=porPessoa[l.colab]||[]).push(l); });
    const pessoas=Object.keys(porPessoa).sort((a,b)=>(nomes[a]||"").localeCompare(nomes[b]||""));

    // ---- aba Espelho
    const cab=["Funcionário","Data","Dia","Entrada","Saída almoço","Volta almoço","Saída","Almoço","Horas trabalhadas","Situação","Todas as batidas"];
    const R=[[cel("Espelho de ponto — "+periodo,S.titulo)],[cel(gerado,S.sub)],[],cab.map(h=>cel(h,S.cab))];
    const alturas=[{hpt:22},{},{},{hpt:30}];
    pessoas.forEach(id=>{
      const dias=[...porPessoa[id]].sort((a,b)=>a.dia.localeCompare(b.dia)); let soma=0, rev=0;
      dias.forEach(l=>{ soma+=l.horas; if(l.alertas.length) rev++;
        const sev=l.alertas.some(a=>a.sev==="bad")?"bad":l.alertas.length?"warn":"ok";
        R.push([cel(nomes[l.colab]||"—",S.nome), cel(serial(l.dia),S.cen,"dd/mm/yyyy"), cel(DS[new Date(l.dia+"T12:00").getDay()],S.cen),
          cel(hm(l.entrada),S.cen,"hh:mm"), cel(hm(l.saidaAlmoco),S.alm,"hh:mm"), cel(hm(l.voltaAlmoco),S.alm,"hh:mm"), cel(hm(l.saida),S.cen,"hh:mm"),
          cel(l.almoco?l.almoco.min/1440:null,S.alm,"[h]:mm"), cel(l.horas/24,S.cen,"[h]:mm"),
          cel(l.alertas.map(a=>a.t).join(" · ")||"ok",S[sev]), cel(l.its.map((r,j)=>l.rot[j]+" "+fmtH(r.momento)).join("  |  "),S.mini)]);
      });
      R.push([cel("Total — "+(nomes[id]||""),S.tot),cel(dias.length+" dia(s)",S.totc),cel("",S.tot),cel("",S.tot),cel("",S.tot),cel("",S.tot),cel("",S.tot),cel("",S.tot),
        cel(soma/24,S.totc,"[h]:mm"), cel(rev?rev+" dia(s) para revisar":"tudo certo",rev?S.bad:S.ok), cel("",S.tot)]);
      R.push([]);
    });
    const wsE=aba(R,[24,11,6,9,12,12,9,9,11,40,70],[{s:{r:0,c:0},e:{r:0,c:10}},{s:{r:1,c:0},e:{r:1,c:10}}],alturas);

    // ---- aba Resumo
    const cabR=["Funcionário","Dias com batida","Horas trabalhadas","Almoço médio","Sem batida de almoço","Almoço menor que 1h","Almoço acima de 2h","Batida faltando","Dias para revisar"];
    const RR=[[cel("Resumo do mês — "+periodo,S.titulo)],[cel(gerado,S.sub)],[],cabR.map(h=>cel(h,S.cab))];
    const T={d:0,h:0,a:0,na:0,s:0,c:0,l:0,f:0,r:0};
    pessoas.forEach(id=>{ const ds=porPessoa[id]; const n=(k)=>ds.filter(l=>l.flags[k]).length;
      const comAlm=ds.filter(l=>l.almoco); const media=comAlm.length?comAlm.reduce((s,l)=>s+l.almoco.min,0)/comAlm.length:null;
      const h=ds.reduce((s,l)=>s+l.horas,0), rev=ds.filter(l=>l.alertas.length).length;
      T.d+=ds.length; T.h+=h; if(media!=null){T.a+=media*comAlm.length; T.na+=comAlm.length;} T.s+=n("semAlmoco"); T.c+=n("almocoCurto"); T.l+=n("almocoLongo"); T.f+=n("faltando"); T.r+=rev;
      const num=(v,bad)=>cel(v,v&&bad?S.bad:S.cen);
      RR.push([cel(nomes[id]||"—",S.nome),cel(ds.length,S.cen),cel(h/24,S.cen,"[h]:mm"),cel(media!=null?media/1440:null,S.alm,"[h]:mm"),
        num(n("semAlmoco"),1),num(n("almocoCurto"),1),num(n("almocoLongo"),1),num(n("faltando"),1),cel(rev,rev?S.bad:S.ok)]);
    });
    RR.push([cel("Total",S.tot),cel(T.d,S.totc),cel(T.h/24,S.totc,"[h]:mm"),cel(T.na?T.a/T.na/1440:null,S.totc,"[h]:mm"),cel(T.s,S.totc),cel(T.c,S.totc),cel(T.l,S.totc),cel(T.f,S.totc),cel(T.r,S.totc)]);
    const wsR=aba(RR,[26,10,11,10,12,12,12,10,10],[{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:8}}],[{hpt:22},{},{},{hpt:32}]);

    const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,wsE,"Espelho"); X.utils.book_append_sheet(wb,wsR,"Resumo");
    X.writeFile(wb,`espelho-ponto-${MESES_P[mes].toLowerCase()}-${ano}${selC?"-"+(nomes[selC]||"").split(" ")[0].toLowerCase():""}.xlsx`);
  }

  return (
    <div>
      <div className="note">Espelho de ponto: cada batida registrada. Clique numa batida para corrigir o horário, ou use os botões para incluir/apagar (esquecimento, atestado, ajuste). Toda alteração fica com método "ajuste". O almoço é reconhecido pela ordem das batidas (entrada → saída almoço → volta almoço → saída); jornada acima de 6h precisa de pelo menos 1h de almoço.</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",marginBottom:14}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>mudarMes(-1)}>‹</button>
        <b style={{fontFamily:"'Space Grotesk'",minWidth:130,textAlign:"center"}}>{MESES_P[mes]} {ano}</b>
        <button className="btn btn-ghost btn-sm" onClick={()=>mudarMes(1)}>›</button>
        <select value={selC} onChange={e=>setSelC(e.target.value)} style={{font:"inherit",padding:"8px 10px",border:"1px solid var(--line)",borderRadius:9}}>
          <option value="">Todos os funcionários</option>
          {colabs.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>
        {comAlerta>0 && <span style={{color:"var(--bad)",fontWeight:600,fontSize:13}}>⚠ {comAlerta} dia(s) para revisar</span>}
        <div style={{flex:1}}></div>
        <button className="btn btn-ghost btn-sm" onClick={exportar} disabled={!linhas.length}>Exportar Excel</button>
        <button className="btn btn-primary btn-sm" onClick={()=>setEdit({ colaborador_id:selC||colabs[0]?.id||"", tipo:"entrada", data:_dl(new Date()), hora:"08:00" })}>+ Nova batida</button>
      </div>

      <div className="card">
        {loading ? <div className="empty">Carregando…</div> :
         linhas.length===0 ? <div className="empty">Sem batidas neste mês.</div> :
         <table>
           <thead><tr><th>Funcionário</th><th>Dia</th><th>Batidas</th><th>Almoço</th><th>Horas</th><th>Situação</th><th></th></tr></thead>
           <tbody>
             {linhas.map((l,i)=>(
               <tr key={i}>
                 <td style={{fontWeight:600}}>{nomes[l.colab]||"—"}</td>
                 <td className="mono">{fmtD(l.dia)}</td>
                 <td><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                   {l.its.map((r,j)=>{ const alm=/almoço/.test(l.rot[j]); return (
                     <button key={r.id} onClick={()=>abrirEdit(r)} title={l.rot[j]+" · clique para corrigir"}
                       style={{font:"inherit",cursor:"pointer",border:"1px solid var(--line)",borderRadius:20,padding:"3px 9px",
                         background: alm ? "#E6EFF9" : r.tipo==="entrada"?"var(--ok-bg)":"#FBEFD6", color: alm ? "#1F6FB2" : r.tipo==="entrada"?"var(--ok)":"var(--warn)",fontWeight:600,fontSize:12.5}}>
                       {alm ? "🍽 " : r.tipo==="entrada"?"▸ ":"◂ "}<span style={{fontWeight:500,fontSize:11}}>{l.rot[j]}</span> {fmtH(r.momento)}{r.metodo==="ajuste"?" ✎":""}
                     </button>); })}
                 </div></td>
                 <td className="mono" style={{whiteSpace:"nowrap"}}>{l.almoco ? fmtMin(l.almoco.min) : "—"}</td>
                 <td className="mono" style={{fontWeight:600}}>{l.horas.toFixed(1)}h</td>
                 <td><Situacao a={l} /></td>
                 <td style={{textAlign:"right"}}><button className="btn btn-ghost btn-sm" onClick={()=>setEdit({ colaborador_id:l.colab, tipo:"saida", data:l.dia, hora:"18:00" })}>+ batida</button></td>
               </tr>
             ))}
           </tbody>
         </table>}
      </div>
      {edit && <BatidaModal b={edit} colabs={colabs} onClose={()=>setEdit(null)} onSave={salvar} onDel={excluir} />}
    </div>
  );
}

function BatidaModal({ b, colabs, onClose, onSave, onDel }){
  const [f,setF]=useState({ id:b.id, colaborador_id:b.colaborador_id||"", tipo:b.tipo||"entrada", data:b.data, hora:b.hora });
  const [err,setErr]=useState(""); const [s,setS]=useState(false);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  async function submit(){ setS(true); const e=await onSave(f); setS(false); if(e) setErr(e); }
  return (
    <div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:440}}>
      <h2>{b.id?"Corrigir batida":"Nova batida"}</h2>
      {err && <div className="err">{err}</div>}
      <div className="grid">
        <div className="field full"><label>Funcionário</label>
          <select value={f.colaborador_id} onChange={e=>set("colaborador_id",e.target.value)}>
            <option value="">— selecione —</option>{colabs.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
          </select></div>
        <div className="field"><label>Tipo</label><select value={f.tipo} onChange={e=>set("tipo",e.target.value)}><option value="entrada">Entrada / volta do almoço</option><option value="saida">Saída / saída para almoço</option></select></div>
        <div className="field"><label>Data</label><input type="date" value={f.data} onChange={e=>set("data",e.target.value)} /></div>
        <div className="field"><label>Hora</label><input type="time" value={f.hora} onChange={e=>set("hora",e.target.value)} /></div>
      </div>
      <div className="modal-actions">
        <div>{b.id && <button className="btn btn-ghost" onClick={()=>{ onDel({id:b.id}); onClose(); }} style={{color:"var(--bad)"}}>Excluir</button>}</div>
        <div style={{display:"flex",gap:8}}><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={submit} disabled={s}>{s?"Salvando…":"Salvar"}</button></div>
      </div>
    </div></div>
  );
}

/* ===== QUIOSQUE (tablet): link, QR e login ===== */
function Quiosque(){
  const url = location.href.replace(/ponto\.html.*$/,"registro-ponto.html");
  const qrRef=useRef(null);
  const [senha,setSenha]=useState(""); const [msg,setMsg]=useState(""); const [busy,setBusy]=useState(false);
  useEffect(()=>{ if(qrRef.current && window.QRCode){ qrRef.current.innerHTML=""; new QRCode(qrRef.current,{ text:url, width:160, height:160 }); } },[url]);
  async function criarLogin(){
    if((senha||"").length<6){ setMsg("A senha do quiosque tem no mínimo 6 dígitos."); return; }
    setBusy(true); setMsg("");
    try{
      const { data:{ session } } = await sb.auth.getSession();
      const r=await fetch(WORKER_ACESSOS,{ method:"POST", headers:{ "Content-Type":"application/json", authorization:"Bearer "+(session?.access_token||"") },
        body: JSON.stringify({ action:"criar", nome:"Quiosque do ponto", email:"quiosque@clinica.local", senha, papel:"quiosque", criarColaborador:false }) });
      const j=await r.json().catch(()=>({error:"resposta inesperada"}));
      setMsg(j.ok ? "Login do quiosque criado: e-mail quiosque@clinica.local e a senha que você definiu." : ("Não criou: "+(j.error||"erro")+" (se já existe, use 'Resetar senha' em Acessos)."));
    }catch(e){ setMsg("Falha ao falar com o Worker: "+(e.message||e)); }
    setBusy(false);
  }
  return (
    <div className="cols">
      <div className="card">
        <h3>Link do quiosque</h3>
        <div className="note">Abra este link no <b>tablet</b> (Chrome) e instale como app (menu ⋮ → "Instalar aplicativo"). Ele fica na recepção lendo o rosto da equipe. Sem login de gestor — usa a conta do quiosque abaixo.</div>
        <div style={{display:"flex",gap:16,alignItems:"center",flexWrap:"wrap"}}>
          <div ref={qrRef}></div>
          <div style={{flex:1,minWidth:220}}>
            <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:6}}>Aponte a câmera do tablet para o QR, ou copie:</div>
            <input readOnly value={url} onFocus={e=>e.target.select()} style={{width:"100%",font:"inherit",fontSize:13,padding:"8px 10px",border:"1px solid var(--line)",borderRadius:9}} />
            <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={()=>{ navigator.clipboard?.writeText(url); setMsg("Link copiado."); }}>Copiar link</button>
          </div>
        </div>
      </div>
      <div className="card">
        <h3>Login do quiosque</h3>
        <div className="note">Conta técnica só para o tablet: entra com <b>quiosque@clinica.local</b> e a senha que você definir. Ela só enxerga o ponto — nenhuma outra tela.</div>
        <div className="field"><label>Senha do quiosque (mín. 6)</label><input value={senha} onChange={e=>setSenha(e.target.value)} placeholder="ex.: 246810" /></div>
        <button className="btn btn-primary" onClick={criarLogin} disabled={busy}>{busy?"Criando…":"Criar login do quiosque"}</button>
        {msg && <div style={{marginTop:10,fontSize:13.5,color:msg.startsWith("Não")||msg.startsWith("Falha")||msg.startsWith("A senha")?"var(--bad)":"var(--ok)"}}>{msg}</div>}
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("cadastro");
  return (
    <div className="wrap">
      <div className="top">
        <div className="brand"><h1>Ponto</h1><p>Cadastro biométrico e relatório de horas</p></div>
        <span className={"mode "+(sb?"live":"demo")}>{sb?"● Conectado ao Supabase":"○ Modo demo — nada é salvo"}</span>
      </div>
      <div className="note">O registro em si é feito pelos funcionários no iPad (quiosque). Aqui você cadastra o rosto (com consentimento) e acompanha as horas. Guardamos só o descritor do rosto, nunca a foto.</div>
      <div className="tabs">
        <button className={tab==="cadastro"?"on":""} onClick={()=>setTab("cadastro")}>Cadastro</button>
        <button className={tab==="espelho"?"on":""} onClick={()=>setTab("espelho")}>Espelho</button>
        <button className={tab==="relatorio"?"on":""} onClick={()=>setTab("relatorio")}>Relatório</button>
        <button className={tab==="quiosque"?"on":""} onClick={()=>setTab("quiosque")}>Quiosque</button>
      </div>
      {tab==="cadastro" ? <Enroll/> : tab==="espelho" ? <Espelho/> : tab==="quiosque" ? <Quiosque/> : <Relatorio/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
