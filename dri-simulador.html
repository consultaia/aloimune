<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dri — Simulador</title>
<!-- ==========================================================================
     SIMULADOR DA DRI — converse com o robô como se fosse um paciente, e veja
     ela marcando na agenda de verdade. Cole a URL do Worker (dri-worker.js).
     ========================================================================== -->
<script>
  const WORKER_URL = "https://dri-clinica.janan-almeida.workers.dev";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
<style>
  :root{ --wa:#075E54; --wa2:#128C7E; --bg:#ECE5DD; --out:#DCF8C6; --in:#fff; --ink:#12212B; --muted:#667; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:#d9d2ca;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
  .phone{width:100%;max-width:420px;height:min(760px,92vh);background:var(--bg);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid #0002}
  .bar{background:var(--wa);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .av{width:38px;height:38px;border-radius:50%;background:#fff2;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk";font-weight:700}
  .bar .nm{font-weight:600} .bar .st{font-size:11px;opacity:.85}
  .bar .reset{margin-left:auto;background:#fff2;border:none;color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
  .chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;
    background-image:linear-gradient(rgba(236,229,221,.9),rgba(236,229,221,.9))}
  .msg{max-width:80%;padding:8px 11px;border-radius:10px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;box-shadow:0 1px 1px #0001}
  .u{align-self:flex-end;background:var(--out);border-bottom-right-radius:3px}
  .a{align-self:flex-start;background:var(--in);border-bottom-left-radius:3px}
  .typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:6px 11px}
  .compose{display:flex;gap:8px;padding:10px;background:#f0f0f0}
  .compose input{flex:1;font:inherit;padding:11px 14px;border:none;border-radius:22px;background:#fff;outline:none}
  .compose button{border:none;background:var(--wa2);color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
  .cfg{padding:16px;text-align:center;color:#a33;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const TEL = "sim-" + Math.random().toString(36).slice(2, 8);

function App(){
  const [msgs,setMsgs]=useState([]);
  const [txt,setTxt]=useState("");
  const [typing,setTyping]=useState(false);
  const chatRef=useRef(null);

  async function chamar(payload){
    setTyping(true);
    try{
      const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telefone:TEL,...payload})});
      const j=await r.json();
      setMsgs(m=>[...m,{who:"a",text:j.resposta||"(sem resposta)"}]);
    }catch(e){ setMsgs(m=>[...m,{who:"a",text:"(erro ao falar com a Dri — confira a URL do Worker)"}]); }
    setTyping(false);
  }
  useEffect(()=>{ if(WORKER_URL) chamar({reset:true}); },[]);
  useEffect(()=>{ if(chatRef.current) chatRef.current.scrollTop=chatRef.current.scrollHeight; },[msgs,typing]);

  function enviar(){ const t=txt.trim(); if(!t) return; setMsgs(m=>[...m,{who:"u",text:t}]); setTxt(""); chamar({mensagem:t}); }
  function reiniciar(){ setMsgs([]); chamar({reset:true}); }

  if(!WORKER_URL) return <div className="phone"><div className="cfg">Cole a URL do Worker da Dri em <b>WORKER_URL</b> no topo deste arquivo para começar.</div></div>;

  return (
    <div className="phone">
      <div className="bar">
        <span className="av">D</span>
        <div><div className="nm">Dri · Aloimune</div><div className="st">assistente virtual · online</div></div>
        <button className="reset" onClick={reiniciar}>reiniciar</button>
      </div>
      <div className="chat" ref={chatRef}>
        {msgs.map((m,i)=><div key={i} className={"msg "+m.who}>{m.text}</div>)}
        {typing && <div className="typing">Dri está digitando…</div>}
      </div>
      <div className="compose">
        <input value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&enviar()} placeholder="Escreva como um paciente…" />
        <button onClick={enviar}>➤</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
